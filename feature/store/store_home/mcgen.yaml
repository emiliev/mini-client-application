# The dashboard exemplar's spec (T-0076, P2-06). `mcgen gen store_home
# --check` renders it and compares the render with this package, byte for
# byte outside keep regions and owned files (plan 02 KD1, ADR-0017). The
# package stays hand-built (ejected); gen writes only .mcgen/manifest.json.
#
# The archetype owns the dashboard's behaviour: the shared section base, one
# bloc per section with its events and its states, the session-dependent
# section, the paged detail page's bloc, the flow, its state, the navigator,
# the flags, the analytics vocabulary, the page, the ARBs, the `.feature`
# files and the steps that read only the test env's names. The domain (API,
# DTOs, mapper, models, repository), the section widgets, the detail page,
# the test env, the contract and flow-scope tests, the golden and BUILD.bazel
# are the module's own (owned). What a tap does is where sections differ most
# (keep regions `<section>.open`). Most of the rest of this file is prose and
# data: the BDD, the strings and the prose slots the templates cannot derive.
schema: mcgen/1
module: store_home
tier: feature
archetype: dashboard
ownership: ejected
exemplar: true
description: The store front in independent sections (banners, deals, categories, featured, cart), and a category's products.
deps: [mc_api_auth, mc_api_client, mc_ds_buttons, mc_ds_cards, mc_ds_feedback, mc_ds_layout, mc_ds_lists, mc_ds_media, mc_ds_theme, mc_formatters, mc_l10n_core, mc_media, retrofit]
dev_deps: [mc_fixtures_commerce, mc_fixtures_identity, mc_fixtures_media, mc_mocked_backend, mc_storage, mocktail]
owned:
  - BUILD.bazel
  - lib/src/domain/api/**
  - lib/src/domain/model/store.dart
  - lib/src/domain/model/store_dto.dart
  - lib/src/domain/model/store_mapper.dart
  - lib/src/domain/repository/**
  - lib/src/presentation/page/category_page.dart
  - lib/src/presentation/widget/**
  - test/contract/**
  - test/feature/util/**
  - test/flow_scope_test.dart
  - test/golden/**
# What a tap does is where the sections differ most; banners also keep the
# helper that routes a banner's target.
keep: [banners.open, banners.members, categories.open, deals.open, featured.open]

navigator:
  name: StoreHomeNavigator
  doc: |-
    What store_home needs from outside: intents in the feature's own
    language, never routes (plan 01 §4.1). Implemented in
    `app/wiring/commerce_wiring` (T-0056). Only blocs call it.

    Four of the DB archetype's six methods (plan 01 §6.1). Deferred until
    their features exist: `openCheckout()` (with the checkout feature, F078)
    and `openPromo(code)` (promo entry). A category of the store is not a
    navigator call: it is a page of this flow.
  outbound: [openComic(ComicId), openSearch(String), openCart(), requestSignIn() -> Future<bool>]

options:
  prefix: Store
  barrel: [ComicId, CategoryId]
  kinds: [comic, category, search, cart]
  params: {openSearch: query}
  screens: {home: store_home, detail: store_category}
  ids:
    - name: CategoryId
      type: String
      doc: |-
        A store category's id (`heroes`, `cosmic`, ...). The flow can open at a
        category (`/store/categories/:id`), so the barrel exports it.

        An extension type: a `String` at run time, but not interchangeable with
        other text at compile time.
    - name: ComicId
      type: int
      doc: |-
        A comic's id in this feature's own vocabulary (features never share types,
        plan 01 §4.3): a product, a deal and a comic banner open the comic by it,
        so the barrel exports it with the navigator.

        An extension type: an `int` at run time, but not interchangeable with
        other ids at compile time.
  flags:
    - name: storeHomeFeatured
      key: store.home_featured
      default: true
      description: Shows the featured products section on the store home.
  detail:
    name: category
    id: CategoryId
    item: Product
    items: products
    fetch_page: fetchCategoryPage
    lookup: fetchCategories
    open_call: openComic
    open_kind: comic
    page_size: 20
    item_id_type: int
  sections:
    - name: banners
      item: StoreBanner
      arg: banner
      fetch: fetchBanners
      uses: [flow, navigator]
      open: |-
        if (startOpenGuard(banner.id)) {
          _open(banner);
        }
      members: |-
        void _open(StoreBanner banner) {
          switch (banner.target) {
            case ComicTarget(:final id):
              tracker.itemTapped(section, StoreItemKind.comic, '${id.value}');
              _navigator.openComic(id);
            case CategoryTarget(:final id):
              tracker.itemTapped(section, StoreItemKind.category, id.value);
              _flow.openCategory(OpenCategory(id: id));
            case SearchTarget(:final query):
              tracker.itemTapped(section, StoreItemKind.search, query);
              _navigator.openSearch(query);
          }
        }
    - name: deals
      item: Deal
      arg: deal
      data: RunningDeals
      ready_params: List<Deal> deals, DateTime now
      ready_args: data.deals, data.asOf
      empty_when: data.deals.isEmpty
      uses: [navigator, clock]
      top: |-
        /// The deals that run at `asOf`, the time they arrived.
        typedef RunningDeals = ({List<Deal> deals, DateTime asOf});
      fetch_method: |2-
          /// The deals that still run when they arrive, with that time: one that has
          /// ended (the backend's list is a moment's, the clock moves on) is left
          /// out, so an all-ended list is the empty state.
          @override
          Future<Result<RunningDeals, ApiFailure>> fetch() async {
            final result = await _repository.fetchDeals();
            final now = _clock.now();
            return result.map(
              (deals) => (
                deals: [
                  for (final deal in deals)
                    if (deal.runsAt(now)) deal,
                ],
                asOf: now,
              ),
            );
          }
      open: |-
        final id = deal.product.id;
        if (startOpenGuard(id.value)) {
          tracker.itemTapped(section, StoreItemKind.comic, '${id.value}');
          _navigator.openComic(id);
        }
    - name: categories
      item: StoreCategory
      arg: category
      fetch: fetchCategories
      uses: [flow]
      open: |-
        if (startOpenGuard(category.id.value)) {
          tracker.itemTapped(
            section,
            StoreItemKind.category,
            category.id.value,
          );
          _flow.openCategory(
            OpenCategory(id: category.id, name: category.name),
          );
        }
    - name: featured
      item: Product
      arg: product
      ready_params: List<Product> products
      fetch: fetchFeatured
      uses: [navigator]
      flag: storeHomeFeatured
      open: |-
        if (startOpenGuard(product.id.value)) {
          tracker.itemTapped(
            section,
            StoreItemKind.comic,
            '${product.id.value}',
          );
          _navigator.openComic(product.id);
        }
    - name: cart
      kind: session
      bloc: CartSummary
      item: CartSummary
      data: CartSummary
      ready_params: CartSummary cart
      empty_when: data.itemCount == 0
      fetch: fetchCart
      uses: [navigator, session]
      open_call: openCart
      open_kind: cart
      open_id: summary
  tests:
    money: "true"
    tag_barrel: T-0056-AC8
    tag_money: T-0056-AC1
    page: store
  prose:
    banners.doc: |-
      The banners section: loads `GET v1/store/banners` on its own, and hands a
      tapped banner over to where it leads: a comic (the app), a category (a
      page of this flow) or a search (the app).
    banners.event.doc: |-
      What the banners section asks for. Hand-written sealed events with private
      cases (Tide), so a page can only create them through the factories.
    banners.event.load: |-
      The first load: the page adds it once it is shown (F-0056 §1).
    banners.event.retry: |-
      Retry after a failure: loads this section again, and only this one.
    banners.event.refresh: |-
      Pull to refresh: reloads and keeps the banners meanwhile. [done]
      completes when the answer arrived, so the refresh control closes.
    banners.event.open: |-
      A banner was tapped.
    banners.state.doc: |-
      A section's state (Tide's shape: private cases read with `state.when`,
      R16). `copyWith` is off: the bloc emits whole states.
    banners.state.loading: |-
      The banners are on their way: the section shows its skeleton.
    banners.state.empty: |-
      The store has no banners right now.
    banners.state.failure: |-
      The banners could not be loaded: the section's own error card with
      Retry. `McBloc` reports it to monitoring (D-16).
    deals.doc: |-
      The deals section: loads `GET v1/store/deals` on its own, with the time
      its countdowns are read against (the injected [StoreClock]), and hands a
      tapped deal's comic over to the app.
    deals.event.doc: |-
      What the deals section asks for (Tide's sealed events, private cases).
    deals.event.load: |-
      The first load: the page adds it once it is shown (F-0056 §1).
    deals.event.retry: |-
      Retry after a failure: loads this section again, and only this one.
    deals.event.refresh: |-
      Pull to refresh; [done] completes when the answer arrived.
    deals.event.open: |-
      A deal was tapped: its comic opens.
    deals.state.doc: |-
      A section's state (Tide's shape, R16).
    deals.state.ready: |-
      The deals that still run, and the time their "ends in" is counted from
      (the injected clock, read when they arrived).
    categories.doc: |-
      The categories section: loads `GET v1/store/categories` on its own, and
      opens a tapped category's page inside the flow.
    categories.event.doc: |-
      What the categories section asks for (Tide's sealed events).
    categories.event.load: |-
      The first load: the page adds it once it is shown (F-0056 §1).
    categories.event.retry: |-
      Retry after a failure: loads this section again, and only this one.
    categories.event.refresh: |-
      Pull to refresh; [done] completes when the answer arrived.
    categories.event.open: |-
      A category was tapped: its page opens inside the flow.
    categories.state.doc: |-
      A section's state (Tide's shape, R16).
    featured.doc: |-
      The featured section: loads `GET v1/store/featured` on its own, and hands
      a tapped product's comic over to the app. It exists only while the flag
      `store.home_featured` is on: the page does not build it otherwise, so
      this bloc is never created and nothing is requested.
    featured.event.doc: |-
      What the featured section asks for (Tide's sealed events).
    featured.event.load: |-
      The first load: the page adds it once it is shown (F-0056 §1).
    featured.event.retry: |-
      Retry after a failure: loads this section again, and only this one.
    featured.event.refresh: |-
      Pull to refresh; [done] completes when the answer arrived.
    featured.event.open: |-
      A product was tapped: its comic opens.
    featured.state.doc: |-
      A section's state (Tide's shape, R16).
    cart.doc: |-
      The cart section: the signed-in user's item count and total
      (`GET v1/me/cart`), which opens the cart.

      - **Signed out** the summary is hidden: the section offers to sign in
        and sends nothing. A tap asks the app (`requestSignIn()`) and waits;
        whatever the answer, the session decides what shows next.
      - **The session decides.** It follows `SessionReader.authState`: a
        sign-in, a sign-out or a user switch anywhere reloads the section for
        the session now current, once per session epoch. An answer that arrives
        for an older epoch (a same-user re-sign-in sends no `authState` event)
        also reloads it.
      - **Every await is a session boundary** (F-0040 fact 21): a cart read
        started for one session and answered under another is dropped before
        any state is written, and the request itself is pinned to its epoch
        (T-0050), so it never goes out with another user's bearer.
    cart.event.doc: |-
      What the cart section asks for (Tide's sealed events).
    cart.event.load: |-
      The first load: the page adds it once it is shown (F-0056 §1).
    cart.event.retry: |-
      Retry after a failure: loads this section again, and only this one.
    cart.event.refresh: |-
      Pull to refresh; [done] completes when the answer arrived (at once
      while signed out: there is nothing to reload).
    cart.event.sign_in: |-
      Signed out, "Sign in to see your cart" was tapped.
    cart.event.open: |-
      The summary was tapped: the cart opens.
    cart.event.session_changed: |-
      Internal: `SessionReader.authState` changed (a sign-in, a sign-out or a
      user switch, here or anywhere else in the app).
    cart.state.doc: |-
      The cart section's state (Tide's shape, R16): the four section cases,
      plus the two a signed-out user sees.
    cart.state.empty: |-
      Signed in, with nothing in the cart.
    cart.state.signed_out: |-
      Nobody is signed in: the summary is hidden and nothing is requested;
      the section offers to sign in.
    cart.state.signing_in: |-
      The app is signing someone in for this section (`requestSignIn()`).
      A static message, no spinner: it may wait for the user indefinitely
      (F-0048 §5.10).
    cart.show_doc: |-
      Shows the section for the session now current: signed out, or its cart.
    step.every_section_but_is_ready.usage: |-
      every section but {'deals'} is ready
    step.every_section_but_shows_its_error.usage: |-
      every section but {'deals'} shows its error
    step.i_leave_the_store.usage: |-
      I leave the store
    step.i_open_a_dialog_over_the_store_and_close_it.usage: |-
      I open a dialog over the store and close it
    step.i_open_the_store.usage: |-
      I open the store
    step.i_pull_the_store_to_refresh.usage: |-
      I pull the store to refresh
    step.i_tap_in_the_section.usage: |-
      I tap {'Amber Frontier #2'} in the {'deals'} section
    step.i_tap_in_the_section_and_again_after_milliseconds.usage: |-
      I tap {'Amber Frontier #2'} in the {'deals'} section and again after {499} milliseconds
    step.i_tap_in_the_section_twice_in_quick_succession.usage: |-
      I tap {'Amber Frontier #2'} in the {'deals'} section twice in quick succession
    step.i_tap_retry_in_the_section.usage: |-
      I tap Retry in the {'deals'} section
    step.i_tap_retry_in_the_section_twice_in_quick_succession.usage: |-
      I tap Retry in the {'deals'} section twice in quick succession
    step.only_the_section_shows_an_error.usage: |-
      only the {'deals'} section shows an error
    step.the_section_is_announced_as.usage: |-
      the {'deals'} section is announced as {'Wird geladen: Angebote'}
    step.the_section_is_loading.usage: |-
      the {'deals'} section is loading
    step.the_section_is_ready.usage: |-
      the {'deals'} section is ready
    step.the_section_shows.usage: |-
      the {'deals'} section shows {'No deals right now.'}
    step.the_section_shows_its_error_with_retry.usage: |-
      the {'deals'} section shows its error with Retry
    step.the_section_was_viewed_times.usage: |-
      the section {'deals'} was viewed {1} times
    step.the_sections_are.usage: |-
      the sections are {'Highlights, Deals, Categories, Featured, Your cart'}
    step.the_store_tap_was_tracked_with_section_kind_and_id.usage: |-
      the store tap was tracked with section {'deals'}, kind {'comic'} and id {'501501'}
    banners.retry_comment: |-
      Only from the error: a second tap finds the section loading.
    base.doc: |-
      The shape every section bloc of a dashboard shares (DB archetype,
      F-0056). One bloc per section, each with its own events and its own
      freezed state (`loading`, `ready`, `empty`, `failure`, plus what a
      section adds): this base holds only the mechanics, so the five sections
      behave alike and none can affect another.

      - **[load]** shows the section's loading state, fetches, and shows
        `ready`, `empty` or `failure`. **Retry** is a [load] of this section
        only. **Pull to refresh** is a [refresh]: the shown state stays until the
        answer lands.
      - **The newest answer wins.** Every load bumps a generation; an answer is
        applied only if no load started after it, so a refresh racing an
        in-flight load (or the other way round) ends on the latest request's
        answer, whichever arrives first (F-0046 fact 7). [fetch] may also
        answer null to drop an answer for a session that is gone (the cart).
      - **`store_section_viewed`** is tracked once per bloc, that is once per
        visit of the page, the first time the section is `ready`: not when it
        failed or is empty, and after a Retry that succeeds.

      [E] is the section's event type, [S] its state, [T] what it fetches.
      Pure Dart (R15).
    base.open_guard: |-
      How long after a hand-over a second hand-over of the same item is
      ignored: the second tap of a double tap (P-089). The same value as the
      other exemplars' open guard.
    detail.page_size: |-
      Products per request: 20, the contract's default page.
    detail.doc: |-
      The category page's bloc: one category's products through a
      [PagingController] (offset and limit: load, load more at the end of the
      list, refresh, retry), and a tapped product's comic handed over to the
      app. The category is the one the flow shows (opened above the store home,
      or the flow's only page for `/store/categories/:id`).

      When the opener did not know the category's name (a banner, a deep link),
      it is looked up once in `GET v1/store/categories` and written into the
      flow state, which titles the page; if that fails, the page keeps its
      generic title.
    detail.event.doc: |-
      What the category page asks for (Tide's sealed events).
    detail.event.load: |-
      Starts over with the first page (the bloc adds it itself).
    detail.event.load_more: |-
      The grid scrolled past its load-more threshold.
    detail.event.retry: |-
      Repeats the request that failed (the first page or a later one).
    detail.event.refresh: |-
      Pull to refresh: reloads the first page and keeps the items meanwhile.
    detail.event.open: |-
      A product was tapped: its comic opens.
    detail.event.page_changed: |-
      Internal: the paging controller produced a new state.
    detail.event.resolve_name: |-
      Internal: the opener did not know the category's name; look it up.
    detail.state.doc: |-
      Tide's state shape (R16). `copyWith` is off: freezed's deep copy of a
      `PagedState` field would name `$PagedStateCopyWith` (F-0031 Part A
      fact 2), and the bloc emits whole states.
    detail.state.loading: |-
      The first page is on its way.
    detail.state.success: |-
      Something to show: products (perhaps loading or failing more), or a
      settled empty category.
    detail.state.not_found: |-
      No category has this id (`404`). Not a failure: nothing to retry.
    detail.state.failure: |-
      The first page failed. `McBloc` reports it to monitoring (D-16).
    detail.open.doc: |-
      A category opens as a page of this flow, not a route (plan 01 §4.1): the
      categories grid and a category banner both open it here.
    detail.open.method: |-
      Opens [category]'s page above the store home. One at a time: a second
      tap while the page slides in keeps the first (F-0031 fact 9).
    flow_state.doc: |-
      What the flow shows, not which page is on top (plan 01 §4.1). Pure Dart,
      so the blocs that update it stay Flutter-free (R15).
    flow_state.root: |-
      The flow opened at this category (`/store/categories/:id`): the
      category page is its only page, so Back leaves the flow (to the
      store route below it, T-0049's nested back stack).
    flow_state.current: |-
      The category whose page is open above the store home.
    flow_state.open: |-
      A category page to show: its id, and its name when the opener knew it
      (the categories grid does; a banner and a deep link do not, so the page
      looks it up).
    flow.doc: |-
      The feature's only entry point (R4): the store front in independent
      sections, whose categories open inside the flow, and whose products,
      banners and cart leave the feature through [navigator].

      The app builds it from a route (`/store`, or `/store/categories/:id` with
      [initialCategory], commerce_wiring) with the navigator implementation
      from its wiring and the backend's [clock]; tests pass a mock and the
      fixtures' clock. It starts from the id alone (plan 01 §4.4).

      Its two pages are screens: `store_home` and `store_category`, tracked
      from inside the flow by `AnalyticsFlowObserver` (P-103, F-0056).

      Immutable after creation: the flow reads [navigator] and [clock] once,
      when its scope opens (`provide:` runs once per flow instance). A
      different [initialCategory] builds a new flow (its `FeatureFlow` is keyed
      by it).
    flow.clock: |-
      The time the deals count down against.
    flow.initial: |-
      Opens the flow at this category: its page is the only one, so Back
      leaves the flow.
    flow_scope.doc: |-
      The root services this flow's container forwards (R17): the parameter
      types of every injectable constructor and `@factoryMethod` in the package,
      minus what the package registers itself and what the flow provides
      (`FeatureFlowController`, the navigator, the `StoreClock`), plus the two
      the flow's widgets read: `FeatureFlagsReader` (the store home page's
      flag) and `AnalyticsTracker` (also the flow observer's).

      HAND-WRITTEN FOR NOW. Plan 01 §4.5 has `mcgen wire` derive this file from
      the same analyzer input injectable reads, and `mcgen check` fail on drift
      (Phase D). Until then `test/flow_scope_test.dart` opens the flow over the
      production-shaped test root and resolves every registration, so a missing
      import fails a test, not the app.
    navigator.openComic: |-
      A product, a deal or a banner that targets a comic: hands over to the
      comic's page.
    navigator.openSearch: |-
      A banner that targets a search: hands over to the search, starting with
      [query].
    navigator.openCart: |-
      The cart summary: hands over to the cart (a placeholder until the cart
      feature exists).
    navigator.requestSignIn: |-
      The cart needs a signed-in user. Completes with true once someone
      signed in, false when the user backed out. The feature does not know
      how signing in works; the app decides.
    analytics.screens: |-
      The screen names of the flow's two pages: their `McFlowPage` names, which
      `AnalyticsFlowObserver` tracks. The first equals the app route's name
      (`/store` is `store_home`), so it is not tracked twice.
    analytics.viewed: |-
      A section reached `ready` for the first time in this visit.
    analytics.tapped: |-
      An item of the store was tapped.
    analytics.section: |-
      Where on the store something was seen or tapped: the analytics `section`
      parameter.
    analytics.detail_doc: |-
      The products of the category page (not a section of the home, so it
      has no `store_section_viewed`).
    analytics.kind: |-
      What a tapped item leads to: the analytics `kind` parameter.
    analytics.tracking: |-
      The store's analytics vocabulary over the blocs' pure-Dart port
      (`AnalyticsTracker`, R15): event names and params are spelled once, here.
    analytics.section_viewed: |-
      `store_section_viewed` with `section`.
    analytics.item_tapped: |-
      `store_item_tapped` with `section`, `kind` and `id` (the target's id:
      a comic id, a category id, a search query, or `summary` for the cart).
    flag.storeHomeFeatured: |-
      The featured section of the store home (the first flag, T-0056). Off: the
      section is not built, so its bloc never exists and `GET v1/store/featured`
      is never sent.

      A feature declares its flags as `const` values in its own package; the
      kit holds none. The page reads it once, when it opens (a section does not
      come and go under the reader), through the root's `FeatureFlagsReader`.
    clock.doc: |-
      The time the deals count down against ("ends in 3 days"). Injected: the
      app passes the backend's clock (the mocked backend's is fixed at
      `2026-01-01T00:00Z`, so its deals always end 1 to 8 days later), and tests
      pass the fixtures' fixed clock. Provided by the flow (`provide:`), so it is
      not a root import.
    page.body_key: |-
      Key of the store home's scrolling body, for tests.
    page.doc: |-
      The store home: provides one bloc per section and nothing else (Tide).

      - **Sections are independent.** Each section has its own bloc, request
        and states. The visit's start reads every bloc (creating it) and adds
        its `load`, so every section loads in parallel, also those below the
        fold, which a lazy list has not built yet (F-0040 fact 6).
      - **The flag decides which sections exist**, read once when the page
        opens: with `store.home_featured` off, the featured section and its bloc
        are never created, so its endpoint is never called.
      - **A visit starts when the page is shown** (F-0056 §1): the blocs exist
        but stay idle while the page is built under another screen (the store
        below a cold `/store/categories/:id` link). The first time the page is
        the flow's top page and the flow's route is the app's current route,
        every section loads, once; the visit lasts as long as the page, so a
        comic opened and closed over the store loads and tracks nothing again.
    page.flag.featured: |-
      Read once per visit: a section does not come and go under the reader
      when the remote flags arrive.
    page.did_change_dependencies: |-
      Depends on the flow's scope, so it runs again when whether the flow is
      visible in the app changes (`FlowScope.outerIsCurrent`: its own route,
      and every flow around it). The store page is always its flow's first
      page when it is built (the category page only ever opens above it), so
      its own flow page needs no check.
    barrel.preamble: |-
      The public surface (R4, checked by mc_arch_check and the architecture
      test): the flow, its navigator, the flow's argument type and the
      navigator's argument types. No `library;` directive (Tide's
      `unnecessary_library_directive`).
    pubspec.preamble: |-
      T-0056 (P1-21): the store_home exemplar feature (archetype DB). Phase D's
      generators copy this package's shape for every dashboard feature (plan 01
      §3.3).

