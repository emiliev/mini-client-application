# The list-detail exemplar's spec (T-0069, P2-04). `mcgen gen characters_list
# --check` renders it and compares the render with this package, byte for
# byte outside keep regions and owned files (plan 02 KD1, ADR-0017). The
# package stays hand-built (ejected); gen writes only .mcgen/manifest.json.
#
# Most of this file is prose: the exemplar's comments are hand-written, so the
# spec carries the ones the templates cannot derive (options.prose, doc:).
schema: mcgen/1
module: characters_list
tier: feature
archetype: list_detail
ownership: ejected
exemplar: true
description: Paged grid of characters with an in-flow preview that hands over to the full profile.
deps: [mc_ds_theme]
# Hand-written after their first write (ADR-0017): the fixture lookups of the
# test env, the contract test and the goldens that predate ADR-0015.
owned:
  - test/contract/**
  - test/feature/util/**
  - test/golden/**
# What an action does is where list-detail features differ most: each
# preview action's and each section item's handler is a keep region.
keep: [list.openSearch, preview.seeFullProfile, section.RelatedComics.open]

entities:
  - name: Character
    doc: |-
      A character as this feature shows it. Domain model: no JSON, so a bare
      `@freezed` (R30 is about models with JSON); the wire shape is
      `CharacterDto`.
    fields:
      - {name: id, type: CharacterId}
      - {name: name, type: String}
      - {name: image, type: ApiImage}
  - name: RelatedComic
    doc: |-
      A comic the previewed character appears in, as the preview lists it.
      Domain model: no JSON (the wire shape is `RelatedComicDto`).
    fields:
      - {name: id, type: ComicId}
      - {name: title, type: String}
      - {name: cover, type: ApiImage}
  - name: CharacterDto
    json: true
    doc: |-
      A character summary as `GET /v1/characters` sends it (CONTRACT.md of
      `mc_fixtures_characters`). The contract test pins it to the fixture JSON.

      The JSON flags are spelled out (R30): under the Bazel shim a bare
      `@freezed` silently loses its JSON (F-0025).
    fields:
      - {name: id, type: int}
      - {name: name, type: String}
      - {name: description, type: String}
      - {name: modified, type: DateTime}
      - {name: thumbnail, type: ThumbnailDto}
  - name: ThumbnailDto
    json: true
    doc: "The `thumbnail` object: an image path plus its variant's wire name."
    fields:
      - {name: path, type: String}
      - {name: variant, type: String}
  - name: RelatedComicDto
    json: true
    doc: |-
      A comic summary as `GET /v1/comics?characterId=` sends it (CONTRACT.md of
      `mc_fixtures_comics`): the preview's related comics (T-0041). The cover
      has the thumbnail's shape.
    fields:
      - {name: id, type: int}
      - {name: title, type: String}
      - {name: issueNumber, type: int}
      - {name: seriesId, type: int}
      - {name: releaseDate, type: String, doc: "A `YYYY-MM-DD` day, kept as text so it round-trips."}
      - {name: cover, type: ThumbnailDto}

endpoints:
  - id: getCharacters
    method: GET
    path: v1/characters
    returns: ApiPage<CharacterDto>
    query:
      - {name: offset, type: int, default: 0}
      - {name: limit, type: int, default: 30}
      - {name: team, type: String?}
  - id: getComicsOf
    method: GET
    path: v1/comics
    returns: ApiPage<RelatedComicDto>
    doc: |-
      The comics [characterId] appears in, in title order (the preview's
      related comics, T-0041).
    query:
      - {name: characterId, type: int, required: true}
      - {name: limit, type: int, default: 5}

navigator:
  name: CharactersListNavigator
  doc: |-
    What characters_list needs from outside: intents in the feature's own
    language, never routes (plan 01 §4.1). Implemented in
    `app/wiring/universe_wiring` (T-0033). Only blocs call it.

    `requestSignIn` (plan 01 §3.3) joins when this feature needs a signed-in
    user.
  outbound: [openCharacter(CharacterId), openComic(ComicId), openSearch()]

