options:
  item: character
  items: characters
  prefix: CharacterDetails
  scroll: profile
  title: name
  ids:
    - name: CharacterId
      type: int
      doc: |-
        A character's id in this feature's own vocabulary (features never share
        types, plan 01 §4.3). The flow starts from it, so the barrel exports it.

        An extension type: an `int` at run time, but not interchangeable with
        other ids at compile time.
    - name: ComicId
      type: int
      doc: |-
        A comic's id as this feature names it: an appearance of the character.
        The navigator takes it (`openComic`), so the barrel exports it. The wiring
        maps it to the app's comic location; it is not the type `comics_details`
        declares (features never share types, plan 01 §4.3).
  entity: Character
  dto: CharacterDto
  item_path: v1/characters/{id}
  related:
    name: comics
    item: comic
    summary: ComicSummary
    page_dto: ComicsPageDto
    path: v1/comics
    param: characterId
    limit: 20
  opens:
    - calls: openComic
      id: ComicId
      label: comic
      event_doc: A comic in the "Comics" row was tapped.
      lookup: comicTitled
      lookup_param: title
  analytics:
    event: character_favourited
    screen: character_details
    method: characterFavourited
  tests:
    fixture_sets: [characters.default, comics.default]
    user_email: reader@mini-client.test
    min_pure: 10
    tags:
      architecture: T-0067-AC6
    env:
      fixture_packages: mc_fixtures_characters mc_fixtures_comics
      fixture_set_lists: charactersFixtureSets comicsFixtureSets
      sample_id: "100002"
    contracts:
      - name: contract_test
        main: test/contract/characters_details_api_contract_test.dart
        comment: The DTOs against the fixture JSON (the one src/ importer, R7).
        deps:
          - ":characters_details"
          - "//utility/mc_fixtures_characters"
          - "//utility/mc_fixtures_comics"
          - "//utility/mc_fixtures_identity"
          - "//utility/mc_media"
          - "//utility/mc_mocked_backend"
          - "@pub_deps//:dio"
          - "@pub_deps//:flutter_test"
      - name: bloc_guards_test
        main: test/contract/character_favourite_bloc_guards_test.dart
        comment: |-
          The favourite bloc's stale-state guard on its own: the real bloc and
          repository over the mocked backend, with no auth interceptor (T-0050).
        deps:
          - ":characters_details"
          - "//utility/mc_bloc_kit"
          - "//utility/mc_event_bus"
          - "//utility/mc_fixtures_characters"
          - "//utility/mc_fixtures_comics"
          - "//utility/mc_fixtures_identity"
          - "//utility/mc_mocked_backend"
          - "//utility/mc_monitoring"
          - "//utility/mc_session"
          - "//utility/mc_storage"
          - "@pub_deps//:dio"
          - "@pub_deps//:flutter_test"
  build:
    pure: [mc_media]
    tests: [mc_api_auth, mc_di, mc_ds_cards, mc_ds_charts, mc_ds_feedback, mc_ds_media, mc_ds_navigation, mc_event_bus, mc_feature_flow, mc_fixtures_characters, mc_fixtures_comics, mc_fixtures_identity, mc_fixtures_media, mc_media, mc_mocked_backend, mc_session, dio, mocktail]
    flow_scope: [mc_monitoring, mc_storage, mc_test_utils, flutter, flutter_test]
  prose:
    build.preamble: |-
      T-0067: `characters_details`, an SC feature (plan 01 §3.3, F002) copied from
      the SC exemplar `comics_details` (T-0041). Phase D's buildgen emits this
      file; until then it is written by hand.
      No per-package analysis_options.yaml: the root file applies (F-0021).

      Every generator runs as a Bazel action; nothing generated is committed:
        freezed      character, character_dto, flow state, both bloc states
        json         character_dto                      (over its freezed output)
        retrofit     characters_details_api             (fork patch 0001)
        injectable   4 shards + di_initializer.config.dart (fork patch 0002)
        gen-l10n     lib/src/l10n/characters_details_l10n*.dart
        BDD          test/feature/*.feature -> :bdd_test (fork patch 0003)

      Staging (plan 03 §3.4, §4.7). Generators read only Flutter-free libraries
      (R15): `_stage` holds the hand-written pure files. Two lanes are narrower so
      that a body edit in a bloc re-runs neither the retrofit part nor the
      injectable aggregate (T-0041-AC7):
        - the retrofit and json actions see only the DTO file and its freezed
          output (`_stage_dto`), never `_stage`;
        - the injectable aggregate sees only the init file and the shards; a bloc
          edit re-runs the shards (all of them, F-0028 §5) but they come out
          byte-identical, so the aggregate is an action-cache hit.
    pubspec.preamble: |-
      T-0067: the character profile (archetype SC, plan 01 F002), in the shape of
      the SC exemplar comics_details.
    navigator.openComic: "A comic in the \"Comics\" row: hands over to the comic's page."
    build.api_rule: "# --- characters_details_api: retrofit (fork patch 0001) -------------------------"
    step.character_is_a_favourite_of.usage: "character {501500} is a favourite of {'reader@mini-client.test'}"
    step.character_is_not_a_favourite_of.usage: "character {501500} is not a favourite of {'reader@mini-client.test'}"
    step.has_character_among_their_favourites.usage: "{'reader@mini-client.test'} has character {501500} among their favourites"
    step.i_open_character.usage: "I open character {501500}"
    step.i_open_character_on_two_pages.usage: "I open character {501500} on two pages"
    step.page_shows.usage: "page {1} shows {'Remove from favourites'}"
    step.the_app_announced_change_to.usage: "the app announced {1} change to {'favourites'}"
    step.the_fact_reads.usage: "the fact {'Origin'} reads {'an archivist of lost maps'}"
    step.the_stats_chart_reads_then.usage: "the stats chart reads {'Power stats of Spiral Warden', 'Intelligence: 72, Strength: 93'}"
    step.comic.open_doc: |-
      The navigator contract: `openComic` with the id of the comic titled
      [title] (from the comics fixture), exactly once, and nothing else.
    api.get_related: |-
      A page of the comics that feature the character (the comics domain's
      reverse lookup), in title order.
    analytics.screen: |-
      The screen name of the flow's one page: its `McFlowPage` name, which
      `AnalyticsFlowObserver` tracks. It equals the app route's name
      (`/characters/:id` is `character_details`), so it is not tracked twice
      (ADR-0012).
    analytics.extension: |-
      The profile's analytics vocabulary over the blocs' pure-Dart port
      (`AnalyticsTracker`, R15, ADR-0012): the event and its parameters are
      spelled once, here.
    analytics.method: |-
      `character_favourited` with `id`, the character's id. Only a saved
      favourite counts: not a removal, a failed write or a sign-in that was
      backed out of.
    repository.related_limit: |-
      How many comics the "Comics" row asks for: one page of the comics
      domain's reverse lookup.
    repository.fetch_related: |-
      The comics the character appears in, in title order (at most
      [comicsLimit]). A character nobody features has none.
    flow.doc: |-
      The feature's only entry point (R4): one character's profile in sections
      (header, bio, stats, comics, favourite). Its comics and its favourite
      leave the feature through [navigator].

      The app builds it from a route (`/characters/:id`, universe_wiring) with
      the navigator implementation from its wiring; tests pass a mock. It starts
      from the id alone (plan 01 §4.4).

      Its one page is the screen `character_details`, tracked from inside the
      flow by `AnalyticsFlowObserver` (ADR-0012).

      Immutable after creation: the flow reads [navigator] and [characterId]
      once, when its scope opens (`provide:` runs once per flow instance). A
      rebuild with a different navigator keeps the first one; a different
      [characterId] builds a new flow (its `FeatureFlow` is keyed by it), with a
      fresh scope, state and first page.
    flow_state.id: |-
      The character the flow opened on (`/characters/:id`); the flow starts
      from the id alone (plan 01 §4.4).
    details_bloc.open_guard: |-
      How long after handing a comic over a second hand-over of the same one is
      ignored: the second tap of a double tap (P-089). By then the opened page
      covers this one. The same value as `comics_details` and
      `discovery_search`.
    details_bloc.doc: |-
      The profile page's bloc: loads the character the flow opened on and the
      comics it appears in, and hands a tapped comic over to the app through the
      navigator, which only blocs call (plan 01 §4.1). A second hand-over of
      the same comic within [openGuard] is ignored, so a double tap opens one
      page.

      Pure Dart (R15): it imports `package:bloc` through `mc_bloc_kit`, never
      Flutter, so every generator that reads it runs on analyzer summaries.
    details_bloc.load_comment: |-
      Both requests start at once: the profile does not wait for the
      comics to ask for them.
    details_bloc.start_guard: |-
      False while a hand-over of the same [target] still guards (the second
      tap of a double tap); else starts the guard for it. A different comic
      goes through at once: popping back and tapping another within
      [openGuard] is not a double tap.
    details_event.doc: |-
      What the profile page asks for. Hand-written sealed events with private
      cases (Tide), so a page can only create them through the factories.
    details_state.success: The character and the comics it appears in (possibly none).
    details_state.failure: |-
      The character or its comics could not be loaded. `McBloc` reports it to
      monitoring (D-16).
