# The second section-detail (SC) exemplar's spec (T-0072, P2-05): the
# hand-built `characters_details` (T-0067), a copy of `comics_details` with a
# second request (the character's comics), analytics, and no inner page. Two
# real modules round-trip through the same archetype, which is what shows
# that it generalises. `mcgen gen characters_details --check` renders this
# spec and compares the render with the package, byte for byte outside keep
# regions and owned files (plan 02 KD1, ADR-0017); the package stays
# hand-built (ejected) and gen writes only .mcgen/manifest.json.
#
# What the archetype does not template is owned: the model files (entity,
# DTOs, mapper), the pages and widgets, the test env, the flow-scope test,
# the contract tests and the steps about this page's own sections. The
# `entities` below are the starting point mcgen would write for them (only
# what the managed files reference); the hand-written files are richer, and
# only their existence is checked.
schema: mcgen/1
module: characters_details
tier: feature
archetype: section_detail
ownership: ejected
exemplar: true
description: One character's profile in sections, with a favourite that asks the app to sign in.
deps: [mc_analytics, mc_ds_buttons, mc_ds_cards, mc_ds_charts, mc_ds_feedback, mc_ds_layout, mc_ds_media, mc_ds_navigation, mc_ds_theme, mc_ds_tokens, mc_l10n_core, mc_media]
dev_deps: [mc_fixtures_characters, mc_fixtures_comics, mc_mocked_backend, mc_storage]
owned:
  - lib/src/domain/model/character.dart
  - lib/src/domain/model/character_dto.dart
  - lib/src/domain/model/character_mapper.dart
  - lib/src/presentation/page/**
  - lib/src/presentation/widget/character_*.dart
  - test/contract/**
  - test/feature/util/characters_details_env.dart
  - test/flow_scope_test.dart
keep: [details.openComic]

entities:
  - name: Character
    doc: |-
      A character as this page shows it.
    fields:
      - {name: id, type: CharacterId}
      - {name: name, type: String}
  - name: ComicSummary
    doc: |-
      A comic the character appears in, as the "Comics" row lists it.
    fields:
      - {name: id, type: ComicId}
      - {name: title, type: String}
  - name: CharacterDto
    json: true
    doc: |-
      `GET /v1/characters/:id`: one character in detail.
    fields:
      - {name: id, type: int}
      - {name: name, type: String}
  - name: ComicSummaryDto
    json: true
    doc: |-
      One comic of `GET /v1/comics?characterId=`.
    fields:
      - {name: id, type: int}
      - {name: title, type: String}
  - name: ComicsPageDto
    json: true
    doc: |-
      `GET /v1/comics?characterId=`: a page of comics.
    fields:
      - {name: results, type: "List<ComicSummaryDto>"}

navigator:
  name: CharacterDetailsNavigator
  doc: |-
    What characters_details needs from outside: intents in the feature's own
    language, never routes (plan 01 §4.1). Implemented in
    `app/wiring/universe_wiring` (T-0067). Only blocs call it.
  outbound: [openComic(ComicId), "requestSignIn() -> bool"]

