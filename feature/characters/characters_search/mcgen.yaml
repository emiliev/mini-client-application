options:
  mode: paged
  item: character
  items: characters
  ids:
    - name: CharacterId
      type: int
      doc: |-
        A character's id in this feature's own vocabulary (features never share
        types, plan 01 §4.3). The navigator takes it, so the barrel exports it.

        An extension type: an `int` at run time, but not interchangeable with
        other ids at compile time.
  history:
    key: characters_search.history
  flow:
    trim_query: true
  analytics:
    file: character_analytics.dart
    const: charactersSearchScreen
  files:
    entity: character.dart
    facets: character_facets.dart
    tile: character_result_tile.dart
    empty_message: empty_search_message.dart
    facets_view: search_facets.dart
  names:
    facets: CharacterFacets
    query: CharactersSearchQuery
    tile: CharacterResultTile
    tile_arg: character
    facets_view: SearchFacets
  results:
    entity: Character
    page_size: 30
    page_size_const: charactersSearchPageSize
    open: openCharacter
    empty_message: emptySearchMessage(l10n, query, facets.team)
  facets:
    - name: sort
      type: CharacterSort
      event: sortChanged
      doc: A sort chip was chosen.
    - name: team
      type: String?
      event: teamChanged
      doc: "A team chip was chosen, or cleared (null: every team)."
  tests:
    lookup.openCharacter: characterNamed
  tags:
    architecture: T-0071-AC6
  prose:
    barrel.preamble: |-
      The public surface (R4, checked by mc_arch_check and the architecture
      test): the flow, its navigator and the navigator's argument type. No
      `library;` directive (Tide's `unnecessary_library_directive`).
    pubspec.preamble: |-
      T-0071: characters_search, name-prefix search over characters with sort and
      team facets, paging and recent searches (archetype SR; copies discovery_search).
    di.key: |-
      The `FileStore` key of the recent character searches. Every flow instance
      reads and writes the same key, so the list survives the flow (and the
      app). It is this feature's own key: the global search keeps its own list.
    analytics.doc: |-
      The screen name of the flow's one page: its `McFlowPage` name, which
      `AnalyticsFlowObserver` tracks. It equals the app route's name
      (`/characters/search` is `characters_search`), so it is not tracked twice
      (ADR-0012).
    navigator.openCharacter: |-
      A character in the results: hands over to the character's profile
      (`characters_details`).
    flow.intro: |-
      The feature's only entry point (R4): search the characters by the start of
      their name, sorted and narrowed by facets, whose results leave the feature
      through [navigator].

      The app builds it from a route (`/characters/search?q=`, universe_wiring)
      with the navigator implementation from its wiring; tests pass a mock. It
      can start from a query alone (plan 01 §4.4).
    flow.screen: |-
      Its one page is the screen `characters_search`, tracked from inside the
      flow by `AnalyticsFlowObserver` (ADR-0012).
    flow.query_doc: |-
      [initialQuery] trimmed, with a blank one as none
      (`/characters/search?q=`): the flow's key, the field's text and the
      search all use this one text, so `?q=%20spi` is `?q=spi`.
    flow_state.initial_query: |-
      The query the flow opened with (`/characters/search?q=spi`): the field
      starts with it and it is searched at once. Null (the flow treats a
      blank query as none) opens on the recent searches.
    bloc.search_debounce: How long typing must pause before a search goes out (T-0071).
    bloc.facets: |-
      - **Facets:** the sort order and the team are sent to the backend. A
        change searches the same query again from the first page (one
        request), and the choice stays for the next query.
    step.i_open_the_search_for.usage: "I open the search for {'spi'}"
    step.i_open_the_search_for.doc: |-
      Opens the flow with an initial query, as the route
      `/characters/search?q=spi` does, and lets it settle (the debounce fires
      within the step).
    step.i_search_for_each_of.usage: "I search for each of {'spi, amber, chron'}"
    step.i_tap_the_result.usage: "I tap the result {'Amber Alchemist'}"
    step.i_tap_the_result_and_again_after_milliseconds.usage: "I tap the result {'Amber Alchemist'} and again after {499} milliseconds"
    step.i_tap_the_result_twice_in_quick_succession.usage: "I tap the result {'Amber Alchemist'} twice in quick succession"
    step.the_app_was_asked_to_open_character.usage: "the app was asked to open character {'Amber Alchemist'}"
    step.the_app_was_asked_to_open_character_times.usage: "the app was asked to open character {'Amber Alchemist'} {2} times"
    step.the_recent_searches_are.usage: "the recent searches are {'spi, amber'}"
    step.i_tap_the_team_chip.doc: |-
      Taps the team chip [label], scrolling the chips until it is on screen.
      Tapping the chosen team again lets every team show.
    step.no_team_is_chosen.doc: "No team chip is selected: every team shows."
    step.the_facets_are_not_shown.doc: |-
      Neither the sort chips nor the team chips are on screen (the recent
      searches show instead).
    step.the_app_was_asked_to_open_character.doc: |-
      The navigator contract: `openCharacter` with [name]'s id (from the
      fixture cast), exactly once, and nothing else.
