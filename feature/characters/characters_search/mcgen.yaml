# The search exemplar's spec, paged shape (T-0073, P2-05). `mcgen gen
# characters_search --check` renders it and compares the render with this
# package, byte for byte outside keep regions and owned files (plan 02 KD1,
# ADR-0017). The package stays hand-built (ejected); gen writes only
# .mcgen/manifest.json.
#
# The archetype owns the search behaviour (field, debounce, recent searches,
# generation guard, paging, facets' events, every state); the domain (API,
# DTOs, mapper, facets, repository), the results widgets, the test env, the
# contract and flow-scope tests and BUILD.bazel are the module's own (owned).
# Most of the rest of this file is prose and data: the BDD, the strings and
# the prose slots the templates cannot derive.
schema: mcgen/1
module: characters_search
tier: feature
archetype: search
ownership: ejected
exemplar: true
description: Name-prefix search over characters with sort and team facets, paging and recent searches.
deps: [json_annotation, mc_api_client, mc_ds_media, mc_media, mc_prelude, retrofit]
dev_deps: [mc_fixtures_characters, mc_fixtures_media, mc_mocked_backend]
owned:
  - BUILD.bazel
  - lib/src/domain/api/**
  - lib/src/domain/model/character.dart
  - lib/src/domain/model/character_dto.dart
  - lib/src/domain/model/character_facets.dart
  - lib/src/domain/model/character_mapper.dart
  - lib/src/domain/repository/**
  - lib/src/presentation/widget/character_result_tile.dart
  - lib/src/presentation/widget/empty_search_message.dart
  - lib/src/presentation/widget/search_facets.dart
  - test/contract/**
  - test/feature/util/**
  - test/flow_scope_test.dart
# What opening a result does is where search features differ most.
keep: [search.open]

navigator:
  name: CharactersSearchNavigator
  doc: |-
    What characters_search needs from outside: intents in the feature's own
    language, never routes (plan 01 §4.1). Implemented in
    `app/wiring/universe_wiring` (T-0071). Only blocs call it.
  outbound: [openCharacter(CharacterId)]

