bdd:
  - feature: characters_search
    title: Search characters by name
    description: |-
      Fans type the start of a name and see the characters that match, sorted by
      name, with their art, and open one.
    background:
      - "# Only the characters domain: the strict harness fails any request to a"
      - "# route nothing serves (opening a result is the app's business)."
      - "Given the backend serves {'characters.default'}"
    scenarios:
      - title: Typing a prefix shows the matching characters, sorted by name, with their art
        tags: [T-0071-AC1, smoke]
        steps:
          - "When I open the search"
          - "And I type {'spi'}"
          - "Then the backend received {1} requests for {'GET /v1/characters'}"
          - "And the backend received {'GET /v1/characters?nameStartsWith=spi&orderBy=name&offset=0&limit=30'}"
          - "And the results show the first {30} characters for {'spi'}"
          - "And the sort {'Name A–Z'} is chosen"
          - "And no team is chosen"
      - title: The prefix matches in any case and is trimmed
        tags: [T-0071-AC1]
        steps:
          - "When I open the search"
          - "And I type {'  SPIRE w '}"
          - "Then the backend received {1} requests for {'GET /v1/characters?nameStartsWith=SPIRE%20w'}"
          - "And the results show the first {4} characters for {'spire w'}"
      - title: A prefix nothing matches shows the empty state
        tags: [T-0071-AC1]
        steps:
          - "When I open the search"
          - "And I type {'zzzz'}"
          - "Then I see {'No characters found'}"
          - "And I see {'No character’s name starts with “zzzz”. Check the spelling or try another name.'}"
          - "And I don't see {'Retry'}"
          - "And the backend received {1} requests for {'GET /v1/characters?nameStartsWith=zzzz'}"
          - "And I see {'Name A–Z'}"
      - title: Clearing the field shows the recent searches again
        tags: [T-0071-AC1]
        steps:
          - "When I open the search"
          - "And I type {'spi'}"
          - "Then I see {'Spindle Alchemist'}"
          - "When I type {''}"
          - "Then I don't see {'Spindle Alchemist'}"
          - "And I see {'Search for characters by the start of their name.'}"
          - "And the facets are not shown"
      - title: The screen is named characters_search
        tags: [T-0071-AC1]
        steps:
          - "When I open the search"
          - "Then the screen {'characters_search'} was tracked"
      - title: A search opened with a query searches it at once
        tags: [T-0071-AC1]
        steps:
          - "When I open the search for {'spi'} without waiting"
          - "Then the backend received {1} requests for {'GET /v1/characters?nameStartsWith=spi'}"
          - "And the field reads {'spi'}"
          - "When {0} milliseconds pass"
          - "Then the backend received {1} requests for {'GET /v1/characters?nameStartsWith=spi'}"
          - "And the results show the first {30} characters for {'spi'}"
      - title: A search opened with a blank query opens on the recent searches
        tags: [T-0071-AC1]
        steps:
          - "When I open the search for {'  '}"
          - "Then I see {'Search for characters by the start of their name.'}"
          - "And the backend received {0} requests for {'GET /v1/characters'}"
          - "And the facets are not shown"
      - title: "A linked query is trimmed: the field and the search use the same text"
        tags: [T-0071-AC1]
        steps:
          - "When I open the search for {' spi '} without waiting"
          - "Then the field reads {'spi'}"
          - "And the backend received {1} requests for {'GET /v1/characters?nameStartsWith=spi'}"
          - "When {0} milliseconds pass"
          - "Then the results show the first {30} characters for {'spi'}"
  - feature: characters_search_typing
    title: Search as you type
    description: |-
      The search waits until typing pauses, sends one request for what was
      typed, shows only the latest query's answer, and remembers what was found.
    background:
      - "Given the backend serves {'characters.default'}"
    scenarios:
      - title: Typing one character at a time sends one request, for the whole word
        tags: [T-0071-AC2, smoke]
        steps:
          - "When I open the search"
          - "And I type {'spi'} one character at a time"
          - "Then the backend received {0} requests for {'GET /v1/characters'}"
          - "When {299} milliseconds pass"
          - "Then the backend received {0} requests for {'GET /v1/characters'}"
          - "When {1} milliseconds pass"
          - "Then the backend received {1} requests for {'GET /v1/characters'}"
          - "And the backend received {'GET /v1/characters?nameStartsWith=spi'}"
          - "When {500} milliseconds pass"
          - "Then the backend received {1} requests for {'GET /v1/characters'}"
          - "And the results show the first {30} characters for {'spi'}"
      - title: The keyboard's Search key searches at once
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I type {'spi'} one character at a time"
          - "And I press Search on the keyboard"
          - "Then the backend received {1} requests for {'GET /v1/characters?nameStartsWith=spi'}"
          - "When {300} milliseconds pass"
          - "Then the backend received {1} requests for {'GET /v1/characters'}"
          - "And the results show the first {30} characters for {'spi'}"
      - title: A pause inside the word sends a request for each pause
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I type {'sp'} one character at a time"
          - "And {300} milliseconds pass"
          - "And I type {'spi'} one character at a time"
          - "And {300} milliseconds pass"
          - "Then the backend received {2} requests for {'GET /v1/characters'}"
          - "And the backend received {'GET /v1/characters?nameStartsWith=sp'}"
          - "And the backend received {'GET /v1/characters?nameStartsWith=spi'}"
      - title: A slow answer for an older query does not replace the newer one's
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "Given the backend holds {'GET /v1/characters?nameStartsWith=spire'}"
          - "When I type {'spire'}"
          - "And the app sends {'GET /v1/characters?nameStartsWith=spire'}"
          - "And I type {'spin'}"
          - "Then the results show the first {30} characters for {'spin'}"
          - "When the backend releases {'GET /v1/characters?nameStartsWith=spire'}"
          - "Then the results show the first {30} characters for {'spin'}"
          - "And I don't see {'Spire Alchemist'}"
          - "And the field reads {'spin'}"
          - "And the backend received {2} requests for {'GET /v1/characters?offset=0'}"
      - title: Answers that arrive in reverse order end on the newer query's
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "Given the backend holds {'GET /v1/characters?nameStartsWith=spire'}"
          - "And the backend holds {'GET /v1/characters?nameStartsWith=spin'}"
          - "When I type {'spire'}"
          - "And the app sends {'GET /v1/characters?nameStartsWith=spire'}"
          - "And I type {'spin'}"
          - "And the app sends {'GET /v1/characters?nameStartsWith=spin'}"
          - "And the backend releases {'GET /v1/characters?nameStartsWith=spin'}"
          - "Then the results show the first {30} characters for {'spin'}"
          - "When the backend releases {'GET /v1/characters?nameStartsWith=spire'}"
          - "Then the results show the first {30} characters for {'spin'}"
          - "And I don't see {'Spire Alchemist'}"
      - title: Clearing the field while a request is in flight shows the recent searches
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "And the app finishes writing to storage"
          - "Given the backend holds {'GET /v1/characters?nameStartsWith=spi'}"
          - "When I type {'spi'}"
          - "And the app sends {'GET /v1/characters?nameStartsWith=spi'}"
          - "And I tap the icon button {'Clear search'}"
          - "Then the recent searches are {'amber'}"
          - "When the backend releases {'GET /v1/characters?nameStartsWith=spi'}"
          - "And the app finishes writing to storage"
          - "Then the recent searches are {'amber'}"
          - "And I don't see {'Spindle Alchemist'}"
          - "And the field reads {''}"
      - title: Changing the query while a request is in flight drops the old answer, and the old query is not saved
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "Given the backend holds {'GET /v1/characters?nameStartsWith=spi'}"
          - "When I type {'spi'}"
          - "And the app sends {'GET /v1/characters?nameStartsWith=spi'}"
          - "And I tap the icon button {'Clear search'}"
          - "And the backend releases {'GET /v1/characters?nameStartsWith=spi'}"
          - "And the app finishes writing to storage"
          - "Then I don't see {'Spindle Alchemist'}"
          - "And I see {'Search for characters by the start of their name.'}"
          - "And the backend received {1} requests for {'GET /v1/characters'}"
      - title: The searches that found something are remembered, most recent first, without repeats, at most 10
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I search for each of {'spi, amber, brass, zzzz, cinder, dusk, ember, frost, gale, hollow, iron, jade, kestrel, spi'}"
          - "And the app finishes writing to storage"
          - "And I tap the icon button {'Clear search'}"
          - "Then the recent searches are {'spi, kestrel, jade, iron, hollow, gale, frost, ember, dusk, cinder'}"
      - title: The recent searches survive a new search flow
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I search for each of {'amber, spi'}"
          - "And the app finishes writing to storage"
          - "And I open the search again"
          - "Then the recent searches are {'spi, amber'}"
          - "And the backend received {2} requests for {'GET /v1/characters'}"
      - title: Tapping a recent search searches it at once
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I search for each of {'amber, spi'}"
          - "And the app finishes writing to storage"
          - "And I open the search again"
          - "And I tap the recent search {'amber'}"
          - "Then the backend received {2} requests for {'GET /v1/characters?nameStartsWith=amber'}"
          - "And the field reads {'amber'}"
          - "When {0} milliseconds pass"
          - "Then the results show the first {30} characters for {'amber'}"
          - "When {300} milliseconds pass"
          - "Then the backend received {2} requests for {'GET /v1/characters?nameStartsWith=amber&offset=0'}"
      - title: A facet change does not save the query again
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "And the app finishes writing to storage"
          - "And I tap the sort chip {'Name Z–A'}"
          - "And the app finishes writing to storage"
          - "And I tap the icon button {'Clear search'}"
          - "Then the recent searches are {'amber'}"
      - title: Clear forgets the recent searches, also for the next search flow
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I search for each of {'amber, spi'}"
          - "And the app finishes writing to storage"
          - "And I open the search again"
          - "And I tap {'Clear'}"
          - "Then I see {'Search for characters by the start of their name.'}"
          - "When the app finishes writing to storage"
          - "And I open the search again"
          - "Then I see {'Search for characters by the start of their name.'}"
          - "And I don't see {'Recent searches'}"
      - title: A search that cannot be saved still shows its results and keeps the recent searches
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "And the app finishes writing to storage"
          - "Given the app can no longer write to storage"
          - "When I type {'spi'}"
          - "And the app finishes writing to storage"
          - "Then the results show the first {30} characters for {'spi'}"
          - "When I tap the icon button {'Clear search'}"
          - "Then the recent searches are {'amber'}"
      - title: A Clear that fails keeps the recent searches and says so
        tags: [T-0071-AC2]
        steps:
          - "When I open the search"
          - "And I search for each of {'amber, spi'}"
          - "And the app finishes writing to storage"
          - "And I open the search again"
          - "Given the app can no longer write to storage"
          - "When I tap {'Clear'}"
          - "And the app finishes writing to storage"
          - "Then the recent searches are {'spi, amber'}"
          - "And I see {'Your recent searches could not be cleared. Please try again.'}"
          - "When I open the search again"
          - "Then the recent searches are {'spi, amber'}"
          - "And I don't see {'Your recent searches could not be cleared. Please try again.'}"
  - feature: characters_search_facets
    title: Sort, narrow and page the matches
    description: |-
      Fans choose how the matches are sorted and which team they belong to, and
      the list loads more matches as they scroll.
    background:
      - "Given the backend serves {'characters.default'}"
    scenarios:
      - title: A sort change sends one request and shows that order from the top
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "Then the sort {'Name A–Z'} is chosen"
          - "When I tap the sort chip {<label>}"
          - "Then the backend received {2} requests for {'GET /v1/characters'}"
          - "And the backend received {1} requests for {'GET /v1/characters?nameStartsWith=amber&orderBy=<order>&offset=0&limit=30'}"
          - "And the sort {<label>} is chosen"
          - "And the results show the first {30} characters for {'amber'} sorted by {'<order>'}"
        examples:
          - ["label", "order"]
          - ["'Name Z–A'", "-name"]
          - ["'Recently updated'", "-modified"]
          - ["'Least recently updated'", "modified"]
      - title: Sorting again by the first order sends one request for it
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "And I tap the sort chip {'Name Z–A'}"
          - "And I tap the sort chip {'Name A–Z'}"
          - "Then the backend received {2} requests for {'GET /v1/characters?orderBy=name'}"
          - "And the backend received {1} requests for {'GET /v1/characters?orderBy=-name'}"
          - "And the results show the first {30} characters for {'amber'}"
      - title: A sort change starts the paging over
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "And I scroll the results until the next page loads"
          - "Then the backend received {1} requests for {'GET /v1/characters?nameStartsWith=amber&orderBy=name&offset=30&limit=30'}"
          - "When I tap the sort chip {'Name Z–A'}"
          - "Then the backend received {1} requests for {'GET /v1/characters?orderBy=-name&offset=0'}"
          - "And the backend received {0} requests for {'GET /v1/characters?orderBy=-name&offset=30'}"
          - "And the backend received {3} requests for {'GET /v1/characters'}"
          - "And the results show the first {30} characters for {'amber'} sorted by {'-name'}"
      - title: A team keeps only its characters, and choosing it again lets every team show
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "And I tap the team chip {'Harbor Watch'}"
          - "Then the backend received {1} requests for {'GET /v1/characters?nameStartsWith=amber&orderBy=name&team=harbor-watch&offset=0&limit=30'}"
          - "And the team {'Harbor Watch'} is chosen"
          - "And the results show the first {8} characters for {'amber'} of team {'Harbor Watch'}"
          - "When I tap the team chip {'Harbor Watch'}"
          - "Then no team is chosen"
          - "And the backend received {3} requests for {'GET /v1/characters'}"
          - "And the backend received {1} requests for {'GET /v1/characters?team=harbor-watch'}"
          - "And the results show the first {30} characters for {'amber'}"
      - title: A team and a sort combine
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'spi'}"
          - "And I tap the team chip {'The Undertow'}"
          - "And I tap the sort chip {'Name Z–A'}"
          - "Then the backend received {'GET /v1/characters?nameStartsWith=spi&orderBy=-name&team=the-undertow&offset=0'}"
          - "And the results show the first {13} characters for {'spi'} of team {'The Undertow'} sorted by {'-name'}"
      - title: A team nobody in the matches belongs to says so, and its chip brings the matches back
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'ember'}"
          - "And I tap the team chip {'Harbor Watch'}"
          - "Then I see {'No characters found'}"
          - "And I see {'No character of Harbor Watch has a name that starts with “ember”. Try another team or name.'}"
          - "And the team {'Harbor Watch'} is chosen"
          - "When I tap the team chip {'Harbor Watch'}"
          - "Then the results show the first {30} characters for {'ember'}"
      - title: The chosen facets stay for the next query
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "And I tap the sort chip {'Name Z–A'}"
          - "And I tap the team chip {'Harbor Watch'}"
          - "And I type {'brass'}"
          - "Then the backend received {1} requests for {'GET /v1/characters?nameStartsWith=brass&orderBy=-name&team=harbor-watch&offset=0'}"
          - "And the results show the first {5} characters for {'brass'} of team {'Harbor Watch'} sorted by {'-name'}"
          - "And the sort {'Name Z–A'} is chosen"
          - "And the team {'Harbor Watch'} is chosen"
      - title: Scrolling to the end of a page loads the next one, once, and the last page ends the list
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "And I scroll the results to the end"
          - "Then the backend received {1} requests for {'GET /v1/characters?nameStartsWith=amber&orderBy=name&offset=30&limit=30'}"
          - "And the backend received {2} requests for {'GET /v1/characters'}"
          - "And the results show the first {38} characters for {'amber'}"
          - "When I scroll the results to the end"
          - "Then the backend received {2} requests for {'GET /v1/characters'}"
      - title: A short list asks for no further page
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'spire w'}"
          - "And I scroll the results to the end"
          - "Then the backend received {1} requests for {'GET /v1/characters'}"
          - "And the results show the first {4} characters for {'spire w'}"
      - title: A failed search explains the problem, and Retry searches the same query again
        tags: [T-0071-AC3]
        steps:
          - "Given the backend fails {'GET /v1/characters'} with {<failure>}"
          - "When I open the search"
          - "And I type {'spi'}"
          - "Then I see {'The search failed'}"
          - "And I see {<message>}"
          - "And {1} errors were reported"
          - "And I see {'Name A–Z'}"
          - "When the backend recovers"
          - "And I tap {'Retry'}"
          - "Then the results show the first {30} characters for {'spi'}"
          - "And I don't see {'The search failed'}"
          - "And the backend received {'GET /v1/characters?nameStartsWith=spi&orderBy=name&offset=0&limit=30'}"
        examples:
          - ["failure", "message"]
          - ["'server_error'", "'The server had a problem. Please try again later.'"]
          - ["'timeout'", "'The request took too long. Please try again.'"]
          - ["'offline'", "'No connection. Check your network and try again.'"]
          - ["'malformed'", "'Something went wrong.'"]
      - title: A double Retry sends one request
        tags: [T-0071-AC3]
        steps:
          - "Given the backend fails {'GET /v1/characters'} with {'malformed'}"
          - "When I open the search"
          - "And I type {'spi'}"
          - "Then I see {'The search failed'}"
          - "When the backend recovers"
          - "And I tap {'Retry'} twice in quick succession"
          - "Then the backend received {2} requests for {'GET /v1/characters?nameStartsWith=spi&offset=0'}"
          - "And the results show the first {30} characters for {'spi'}"
      - title: A failed second page keeps the loaded characters and offers Retry
        tags: [T-0071-AC3]
        steps:
          - "Given the backend fails {'GET /v1/characters?offset=30'} with {'server_error'}"
          - "When I open the search"
          - "And I type {'amber'}"
          - "And I scroll the results to the end"
          - "Then I see {'Could not load more characters.'}"
          - "And I see {'Retry'}"
          - "When the backend recovers"
          - "And I tap {'Retry'}"
          - "Then the results show the first {38} characters for {'amber'}"
          - "And I don't see {'Could not load more characters.'}"
      - title: A failed facet change shows the failure, and Retry brings that order back
        tags: [T-0071-AC3]
        steps:
          - "When I open the search"
          - "And I type {'amber'}"
          - "Given the backend fails {'GET /v1/characters?orderBy=-name'} with {'server_error'}"
          - "When I tap the sort chip {'Name Z–A'}"
          - "Then I see {'The search failed'}"
          - "And the sort {'Name Z–A'} is chosen"
          - "When the backend recovers"
          - "And I tap {'Retry'}"
          - "Then the results show the first {30} characters for {'amber'} sorted by {'-name'}"
  - feature: characters_search_open
    title: Open a result and read the search in other languages
