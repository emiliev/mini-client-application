# The form/wizard exemplar, one-form shape (T-0075, P2-06). `mcgen gen
# auth_signin --check` renders this spec and compares the render with this
# package, byte for byte outside keep regions and owned files (plan 02 KD1,
# ADR-0017). The package stays hand-built (ejected); gen writes only
# .mcgen/manifest.json.
#
# The archetype owns what every form or wizard feature shares: the barrel, the
# DI initializer, the navigator contract, the flow state, the flow (its
# arguments, result and pages), the root-import list, the architecture test,
# the package files, the strings and the .feature files. The form's rules,
# the bloc, the domain, the pages, the test env, the steps, the contract tests
# and BUILD.bazel are the module's own (owned).
schema: mcgen/1
module: auth_signin
tier: feature
archetype: form_wizard
ownership: ejected
exemplar: true
description: The sign-in form (email, password, demo accounts) that ends with a result saying whether the user signed in.
deps:
  - bloc
  - flutter
  - flutter_bloc
  - freezed_annotation
  - mc_api_auth
  - mc_api_errors
  - mc_bloc_kit
  - mc_di
  - mc_ds_buttons
  - mc_ds_feedback
  - mc_ds_forms
  - mc_ds_inputs
  - mc_ds_layout
  - mc_ds_navigation
  - mc_ds_theme
  - mc_ds_tokens
  - mc_feature_flow
  - mc_forms
  - mc_l10n_core
  - mc_monitoring
  - mc_prelude
  - mc_session
dev_deps:
  - flutter_test
  - mc_fixtures_identity
  - mc_mocked_backend
  - mc_storage
  - mc_test_utils
  - mocktail
  - test
owned:
  - BUILD.bazel
  - lib/src/domain/**
  - lib/src/presentation/**
  - test/contract/**
  - test/feature/step/**
  - test/feature/util/**
  - test/flow_scope_test.dart
  - test/unit/**

navigator:
  name: AuthSignInNavigator
  doc: |-
    What auth_signin needs from outside: intents in the feature's own
    language, never routes (plan 01 §4.1). Implemented in
    `app/wiring/account_wiring` (T-0066).

    It has no outbound methods yet: the form ends with a result
    (`AuthSignInFlow.onComplete`) and the app decides where that leads (back
    to the caller, or to the link that asked for the sign-in). Sign-up and
    password reset would add intents here.
  outbound: []

options:
  pascal: AuthSignIn
  stem: auth_signin
  l10n_file: auth_signin_l10n
  arb: block_placeholders
  types:
    DemoAccount: domain/model/demo_account.dart
    SignInReason: domain/model/sign_in_reason.dart
    SignInResult: domain/model/sign_in_result.dart
    SignInPage: presentation/page/sign_in_page.dart
    AuthApi: package:mc_api_auth/mc_api_auth.dart
    Monitoring: package:mc_monitoring/mc_monitoring.dart
    SessionReader: package:mc_session/mc_session.dart
  barrel: [DemoAccount, SignInReason, SignInResult]
  root_imports: [AuthApi, Monitoring, SessionReader]
  flow:
    args:
      - name: reason
        type: SignInReason?
        doc: What the user is signing in for; null says nothing.
      - name: demoAccounts
        type: List<DemoAccount>
        default: "const []"
        doc: The accounts "Use a demo account" offers; none hides the helper.
    result:
      type: SignInResult
      cast: result! as SignInResult
    state: "AuthSignInFlowState(reason: reason, demoAccounts: demoAccounts)"
    pages:
      - name: auth_sign_in
        widget: "SignInPage(reason: state.reason, demoAccounts: state.demoAccounts)"
  flow_state:
    fields:
      - name: reason
        type: SignInReason?
        doc: What the user is signing in for; null says nothing.
      - name: demoAccounts
        type: List<DemoAccount>
        default: "<DemoAccount>[]"
        doc: The accounts "Use a demo account" offers; none hides the helper.
  architecture:
    tag: T-0066-AC1
    pure_files_over: 8
  prose:
    pubspec.preamble: "T-0066 (F045): the auth_signin feature (archetype FW, one form page)."
    barrel.preamble: |-
      The public surface (R4, checked by mc_arch_check and the architecture
      test): the flow, its navigator, and the flow's argument and result types.
      No `library;` directive (Tide's `unnecessary_library_directive`).
    flow_scope.doc: |-
      The root services this flow's container forwards (R17): the parameter
      types of every injectable constructor and `@factoryMethod` in the package,
      minus what the package registers itself and what the flow provides
      (`FeatureFlowController`, the navigator).

      HAND-WRITTEN FOR NOW (as in library_reading_list_editor):
      `test/flow_scope_test.dart` opens the flow over the production-shaped test
      root and resolves every registration, so a missing import fails a test,
      not the app.
    flow_state.doc: |-
      The flow's arguments, which the flow starts from (plan 01 §4.4). The form
      has one page, so nothing changes while it is open; the form's values live
      in the bloc's form controller.
    flow.doc: |-
      The feature's only entry point (R4): the sign-in form, which **ends with a
      result**.

      - When the user signs in, [onComplete] is called once with
        [SignInResult.signedIn] (the session has started).
      - When the user taps "Not now", it is called once with
        [SignInResult.cancelled].
      - When the user leaves by Back, the app's route is popped and [onComplete]
        is not called; the route's own pop gives its caller null.

      The app builds it from a route (`/auth/sign-in`, account_wiring) whose
      [onComplete] hands the result to whoever pushed the route, or goes on to
      the link the guard sent the user from. Tests pass a recorder. It starts
      from its arguments alone (plan 01 §4.4).

      Immutable after creation: the flow reads [reason] and [demoAccounts] once,
      when its scope opens.
    flow.result_doc: The flow's result. Called at most once.

