# The form/wizard exemplar, three-step shape (T-0075, P2-06). `mcgen gen
# library_reading_list_editor --check` renders this spec and compares the
# render with this package, byte for byte outside keep regions and owned files
# (plan 02 KD1, ADR-0017). The package stays hand-built (ejected); gen writes
# only .mcgen/manifest.json.
#
# The archetype owns what every form or wizard feature shares: the barrel, the
# DI initializer, the navigator contract, the flow state, the flow (its
# arguments, result and pages), the root-import list, the architecture test,
# the package files, the strings and the .feature files. The wizard's rules,
# the bloc, the domain, the step pages, the test env, the steps, the contract
# tests, the golden test and BUILD.bazel are the module's own (owned).
schema: mcgen/1
module: library_reading_list_editor
tier: feature
archetype: form_wizard
ownership: ejected
exemplar: true
description: A three-step wizard that creates or edits a reading list and ends with the saved list's id.
deps:
  - bloc
  - dio
  - flutter
  - flutter_bloc
  - freezed_annotation
  - json_annotation
  - mc_api_auth
  - mc_api_client
  - mc_api_errors
  - mc_bloc_kit
  - mc_di
  - mc_ds_buttons
  - mc_ds_feedback
  - mc_ds_forms
  - mc_ds_inputs
  - mc_ds_layout
  - mc_ds_media
  - mc_ds_navigation
  - mc_ds_theme
  - mc_ds_tokens
  - mc_event_bus
  - mc_feature_flow
  - mc_forms
  - mc_l10n_core
  - mc_media
  - mc_monitoring
  - mc_paging
  - mc_prelude
  - mc_session
  - retrofit
dev_deps:
  - flutter_test
  - mc_fixtures_comics
  - mc_fixtures_identity
  - mc_fixtures_library
  - mc_fixtures_media
  - mc_mocked_backend
  - mc_storage
  - mc_test_utils
  - mocktail
  - test
owned:
  - BUILD.bazel
  - lib/src/domain/**
  - lib/src/presentation/**
  - test/contract/**
  - test/feature/step/**
  - test/feature/util/**
  - test/flow_scope_test.dart
  - test/golden/**

navigator:
  name: ReadingListEditorNavigator
  doc: |-
    What library_reading_list_editor needs from outside: intents in the
    feature's own language, never routes (plan 01 §4.1). Implemented in
    `app/wiring/library_wiring` (T-0048). Only blocs call it.

    The editor's result (the saved list) does not go through the navigator:
    the flow completes with it (`ReadingListEditorFlow.onComplete`) and the
    wiring hands it back to whoever opened the editor (plan 01 §4.3).
  outbound: ["requestSignIn() -> Future<bool>"]

options:
  pascal: ReadingListEditor
  stem: reading_list_editor
  l10n_file: reading_list_editor_l10n
  arb: block_placeholders
  types:
    ReadingListId: domain/model/reading_list_id.dart
    ReadingListDetailsPage: presentation/page/details_page.dart
    ReadingListComicsPage: presentation/page/comics_page.dart
    ReadingListReviewPage: presentation/page/review_page.dart
    Dio: package:dio/dio.dart
    EventBus: package:mc_event_bus/mc_event_bus.dart
    Monitoring: package:mc_monitoring/mc_monitoring.dart
    SessionReader: package:mc_session/mc_session.dart
  barrel: [ReadingListId]
  root_imports: [Dio, EventBus, Monitoring, SessionReader]
  flow:
    key: editing
    args:
      - name: editing
        type: ReadingListId?
        doc: The list to edit; null creates a new one.
    result:
      type: ReadingListId?
      cast: result as ReadingListId?
    state: "ReadingListEditorFlowState(editing: editing)"
    pages:
      - name: details
        widget: "ReadingListDetailsPage()"
        const: true
      - name: comics
        widget: "ReadingListComicsPage()"
        const: true
        when: "state.step >= 1"
      - name: review
        widget: "ReadingListReviewPage()"
        const: true
        when: "state.step >= 2"
  flow_state:
    fields:
      - name: editing
        type: ReadingListId?
        doc: |-
          The list being edited; null when a new list is created. The flow
          starts from the id alone (plan 01 §4.4).
      - name: step
        type: int
        default: "0"
        doc: |-
          The deepest open step page (0 to 2). It mirrors the wizard's step:
          the bloc writes it after each step change, and a pop of a step page
          (back gesture, back button) is applied to the wizard.
  architecture:
    tag: T-0048-AC7
    pure_files_over: 12
  prose:
    pubspec.preamble: |-
      T-0048 (P1-20): the library_reading_list_editor exemplar feature (archetype
      FW). Phase D's generators copy this package's shape for every form/wizard
      feature (plan 01 §3.3).
    barrel.preamble: |-
      The public surface (R4, checked by mc_arch_check and the architecture
      test): the flow, its navigator, and the flow's argument and result type.
      No `library;` directive (Tide's `unnecessary_library_directive`).
    architecture.barrel_phrase: argument and result type
    architecture.shown_comment: "The flow, its navigator, and the flow's argument and result type."
    navigator.requestSignIn: |-
      Reading lists belong to a signed-in user. Completes with true once
      someone is signed in, false when the user backed out. The feature does
      not know how signing in works; the app decides (a sheet, a route).
    flow_scope.doc: |-
      The root services this flow's container forwards (R17): the parameter
      types of every injectable constructor and `@factoryMethod` in the package,
      minus what the package registers itself and what the flow provides
      (`FeatureFlowController`, the navigator).

      HAND-WRITTEN FOR NOW. Plan 01 §4.5 has `mcgen wire` derive this file from
      the same analyzer input injectable reads, and `mcgen check` fail on drift
      (Phase D). Until then `test/flow_scope_test.dart` opens the flow over the
      production-shaped test root and resolves every registration, so a missing
      import fails a test, not the app.
    flow_state.doc: |-
      The step pages that are open: step 0 (details) is the flow's root, step 1
      (comics) and step 2 (order and review) are pushed on it, so a back
      gesture on a later step returns to the step before it inside the flow.
      Pure Dart, so the blocs that update it stay Flutter-free (R15).

      The wizard's values are not here: they live in the editor bloc's
      `WizardController`, which outlives the step pages. A pop restores the
      flow state the lower page had (`FeatureFlow`), which would drop what was
      entered on the popped step; the wizard keeps it (T-0048-AC6).
    flow.doc: |-
      The feature's only entry point (R4): a three-step wizard that creates a
      reading list, or edits the one [editing] names, and **ends with a
      result**.

      The flow result (plan 01 §4.3, first used here; the FW archetype's shape):
      - When the wizard saves, the flow completes with the saved list's id:
        [onComplete] is called once with it.
      - When the flow ends without saving (the user declined to sign in, or
        closed the editor after the session changed), [onComplete] is called
        once with null.
      - When the user leaves by Back from step 1, the app's route is popped and
        [onComplete] is not called; the route's own pop gives its caller null.

      The app builds it from a route (`/me/lists/new`, `/me/lists/:id/edit`,
      library_wiring), whose [onComplete] pops that route with the id, so
      whoever pushed the route awaits the result. Tests pass a recorder. It
      starts from the id alone (plan 01 §4.4).

      Immutable after creation: the flow reads [navigator] and [editing] once,
      when its scope opens. A different [editing] builds a new flow (its
      `FeatureFlow` is keyed by it).
    flow.result_doc: |-
      The flow's result: the saved list's id, or null when it ended without
      saving. Called at most once.
    flow.pages_comment: |-
      One page per step, pushed in order, so a back gesture on a later
      step returns to the step before it.

