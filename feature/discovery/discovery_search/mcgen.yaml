# The search exemplar's spec, grouped shape (T-0073, P2-05). `mcgen gen
# discovery_search --check` renders it and compares the render with this
# package, byte for byte outside keep regions and owned files (plan 02 KD1,
# ADR-0017). The package stays hand-built (ejected); gen writes only
# .mcgen/manifest.json.
#
# The archetype owns the search behaviour (field, debounce, minimum length,
# recent searches, generation guard, the client-side type filter, every
# state); the domain (API, DTOs, mapper, results model, repository), the
# results widgets, the test env, the contract and flow-scope tests, the
# goldens and BUILD.bazel are the module's own (owned).
schema: mcgen/1
module: discovery_search
tier: feature
archetype: search
ownership: ejected
exemplar: true
description: Search across characters and comics, with a type filter and recent searches.
deps: [json_annotation, mc_api_client, mc_ds_media, mc_media, mc_prelude, retrofit]
dev_deps: [mc_fixtures_characters, mc_fixtures_comics, mc_fixtures_discovery, mc_fixtures_media, mc_mocked_backend, mocktail]
owned:
  - BUILD.bazel
  - lib/src/domain/api/**
  - lib/src/domain/model/search_dto.dart
  - lib/src/domain/model/search_mapper.dart
  - lib/src/domain/model/search_results.dart
  - lib/src/domain/repository/**
  - lib/src/presentation/widget/search_result_tile.dart
  - lib/src/presentation/widget/search_results_view.dart
  - test/contract/**
  - test/feature/util/**
  - test/flow_scope_test.dart
  - test/golden/**
# What opening a result does is where search features differ most.
keep: [search.open]

navigator:
  name: DiscoverySearchNavigator
  doc: |-
    What discovery_search needs from outside: intents in the feature's own
    language, never routes (plan 01 §4.1). Implemented in
    `app/wiring/discovery_wiring` (T-0046). Only blocs call it.
  outbound: [openCharacter(CharacterId), openComic(ComicId)]

