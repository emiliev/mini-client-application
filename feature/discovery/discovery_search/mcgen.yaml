options:
  mode: grouped
  item: result
  items: results
  arb: block_placeholders
  ids:
    - name: CharacterId
      type: int
      doc: |-
        A character's id as this feature names it: a character among the results.
        The navigator takes it (`openCharacter`), so the barrel exports it. The
        wiring maps it to the app's character location; it is not the type
        `characters_list` or `comics_details` declares (features never share
        types, plan 01 §4.3).

        An extension type: an `int` at run time, but not interchangeable with
        other ids at compile time.
    - name: ComicId
      type: int
      doc: |-
        A comic's id as this feature names it: a comic among the results. The
        navigator takes it (`openComic`), so the barrel exports it.
  query:
    min_length: 2
  files:
    results: search_results.dart
    results_view: search_results_view.dart
  names:
    results: SearchResults
    hit: SearchHit
    filter: SearchFilter
    results_view: SearchResultsView
  filter:
    default: SearchFilter.all
  hits:
    - {class: CharacterHit, calls: openCharacter}
    - {class: ComicHit, calls: openComic}
  tests:
    result_arg: title
    result_tap_doc: |-
      Scrolls the results until the row titled [title] is on screen, then taps
      it once.
  tags:
    architecture: T-0046-AC7
  prose:
    pubspec.preamble: |-
      T-0046 (P1-19): the discovery_search exemplar feature (archetype SR). Phase
      D's generators copy this package's shape for every search feature (plan 01
      §3.3).
    navigator.openCharacter: "A character in the results: hands over to the character's page."
    navigator.openComic: "A comic in the results: hands over to the comic's page."
    flow.intro: |-
      The feature's only entry point (R4): search across characters and comics,
      whose results leave the feature through [navigator].

      The app builds it from a route (`/search?q=`, discovery_wiring) with the
      navigator implementation from its wiring; tests pass a mock. It can start
      from a query alone (plan 01 §4.4).
    flow.query_doc: "[initialQuery], with a blank one as none (`/search?q=`)."
    flow_state.initial_query: |-
      The query the flow opened with (`/search?q=spi`): the field starts
      with it and it is searched at once. Null (the flow treats a blank
      query as none) opens on the recent searches.
    bloc.search_debounce: How long typing must pause before a search goes out (P1-19).
    bloc.min_length: |-
      The shortest query the backend searches (`mc_fixtures_discovery`
      CONTRACT.md); a shorter one sends no request. The backend counts after
      folding accents away, so it may still answer "too short" for a query the
      client counts as long enough; that answer shows the recent searches too.
    event.filter_changed: A type chip was chosen (or a group's "Show 20").
    step.i_open_the_search_for.usage: "I open the search for {'spi'}"
    step.i_open_the_search_for.doc: |-
      Opens the flow with an initial query, as the route `/search?q=spi` does,
      and lets it settle (the debounce fires within the step).
    step.i_open_the_search_for_without_waiting.doc: |-
      Opens the flow with an initial query, as the route `/search?q=spi`
      does, and draws one frame: no fake time passes (a debounce would not
      have fired) and no real storage I/O completes (the recent searches are
      still being read).
    step.i_search_for_each_of.usage: "I search for each of {'spi, amber, chron'}"
    step.i_tap_the_result.usage: "I tap the result {'Spindle Chronicles #1'}"
    step.the_recent_searches_are.usage: "the recent searches are {'spi, amber'}"
