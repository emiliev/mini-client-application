options:
  item: comic
  items: comics
  prefix: ComicsDetails
  ids:
    - name: ComicId
      type: int
      doc: |-
        A comic's id in this feature's own vocabulary (features never share types,
        plan 01 §4.3). The flow starts from it, so the barrel exports it.

        An extension type: an `int` at run time, but not interchangeable with
        other ids at compile time.
    - name: CharacterId
      type: int
      doc: |-
        A character's id as this feature names it: a member of the comic's cast.
        The navigator takes it (`openCharacter`), so the barrel exports it. The
        wiring maps it to the app's character location; it is not the type
        `characters_list` declares (features never share types, plan 01 §4.3).
    - name: CreatorId
      type: int
      doc: |-
        A creator's id: someone credited on the comic. The navigator takes it
        (`openCreator`), so the barrel exports it.
  entity: Comic
  dto: ComicDto
  item_path: v1/comics/{id}
  opens:
    - calls: openCharacter
      id: CharacterId
      label: character
      event_doc: A character in the cast section was tapped.
      lookup: characterNamed
      id_local: true
    - calls: openCreator
      id: CreatorId
      label: creator
      event_doc: A creator in the credits was tapped.
  cover:
    field: cover
    event: openCover
    page: ComicCoverPage
    page_name: cover
  tests:
    fixture_sets: [comics.default]
    user_email: reader@mini-client.test
    legacy_goldens: true
    plain_facts: true
    min_pure: 12
    tags:
      architecture: T-0041-AC7
    env:
      fixture_packages: mc_fixtures_comics mc_fixtures_characters
      fixture_set_lists: comicsFixtureSets charactersFixtureSets
      sample_id: "501500"
    contracts:
      - name: contract_test
        main: test/contract/comics_details_api_contract_test.dart
        comment: The DTOs against the fixture JSON (the one src/ importer, R7).
        deps:
          - ":comics_details"
          - "//utility/mc_fixtures_characters"
          - "//utility/mc_fixtures_comics"
          - "//utility/mc_fixtures_identity"
          - "//utility/mc_formatters"
          - "//utility/mc_media"
          - "//utility/mc_mocked_backend"
          - "@pub_deps//:dio"
          - "@pub_deps//:flutter_test"
      - name: bloc_guards_test
        main: test/contract/comic_favourite_bloc_guards_test.dart
        comment: |-
          The favourite bloc's stale-state guard on its own: the real bloc and
          repository over the mocked backend, with no auth interceptor (T-0050).
        deps:
          - ":comics_details"
          - "//utility/mc_bloc_kit"
          - "//utility/mc_event_bus"
          - "//utility/mc_fixtures_comics"
          - "//utility/mc_fixtures_identity"
          - "//utility/mc_mocked_backend"
          - "//utility/mc_monitoring"
          - "//utility/mc_session"
          - "//utility/mc_storage"
          - "@pub_deps//:dio"
          - "@pub_deps//:flutter_test"
  build:
    pure: [mc_formatters, mc_media]
    tests: [mc_api_auth, mc_di, mc_ds_cards, mc_ds_feedback, mc_ds_media, mc_ds_navigation, mc_event_bus, mc_feature_flow, mc_fixtures_characters, mc_fixtures_comics, mc_fixtures_identity, mc_fixtures_media, mc_media, mc_mocked_backend, mc_session, dio, mocktail]
    flow_scope: [mc_monitoring, mc_storage, mc_test_utils, flutter, flutter_test]
  prose:
    pubspec.preamble: |-
      T-0041 (P1-18): the comics_details exemplar feature (archetype SC). Phase D's
      generators copy this package's shape for every section/detail feature
      (plan 01 §3.3).
    build.preamble: |-
      T-0041 (P1-18): `comics_details`, the SC exemplar feature (plan 01 §3.3).
      Phase D's buildgen emits this file; until then it is written by hand. It has
      the shape of characters_list's (T-0032), the LD exemplar.
      No per-package analysis_options.yaml: the root file applies (F-0021).

      Every generator runs as a Bazel action; nothing generated is committed:
        freezed      comic, comic_dto, flow state, both bloc states
        json         comic_dto                      (over its freezed output)
        retrofit     comics_details_api             (fork patch 0001)
        injectable   4 shards + di_initializer.config.dart (fork patch 0002)
        gen-l10n     lib/src/l10n/comics_details_l10n*.dart
        BDD          test/feature/*.feature -> :bdd_test (fork patch 0003)

      Staging (plan 03 §3.4, §4.7). Generators read only Flutter-free libraries
      (R15): `_stage` holds the hand-written pure files. Two lanes are narrower so
      that a body edit in a bloc re-runs neither the retrofit part nor the
      injectable aggregate (T-0041-AC7):
        - the retrofit and json actions see only the DTO file and its freezed
          output (`_stage_dto`), never `_stage`;
        - the injectable aggregate sees only the init file and the shards; a bloc
          edit re-runs the shards (all of them, F-0028 §5) but they come out
          byte-identical, so the aggregate is an action-cache hit.
    build.tests_rule: "# --- tests (R6: BDD + contract + l10n + golden; no solitary unit tests) -----"
    navigator.openCharacter: "A character in the cast section: hands over to the character's page."
    navigator.openCreator: "A creator in the credits: hands over to the creator's page."
    step.i_scroll_the_comic_until_i_see.usage: "I scroll the comic until I see {'Characters'}"
    step.page_shows.usage: "page {1} shows {'Remove from favourites'}"
    step.the_fact_reads.usage: "the fact {'Price'} reads {'$3.99'}"
    step.the_app_announced_change_to.usage: "the app announced {1} change to {'favourites'}"
    api.get_favourite: |-
      `200` when the comic is a favourite of the signed-in user, `404` when
      it is not. Needs the bearer.
    step.character.open_doc: |-
      The navigator contract: `openCharacter` with [name]'s id (from the
      characters fixture), exactly once, and nothing else.
    flow.doc: |-
      The feature's only entry point (R4): one comic's page in sections, whose
      cover opens full size inside the flow, and whose characters, creators and
      favourite leave the feature through [navigator].

      The app builds it from a route (`/comics/:id`, publishing_wiring) with the
      navigator implementation from its wiring; tests pass a mock. It starts
      from the id alone (plan 01 §4.4).

      Immutable after creation: the flow reads [navigator] and [comicId] once,
      when its scope opens (`provide:` runs once per flow instance). A rebuild
      with a different navigator keeps the first one; a different [comicId]
      builds a new flow (its `FeatureFlow` is keyed by it), with a fresh scope,
      state and first page.
    flow_state.doc: |-
      What the flow shows, not which page is on top (plan 01 §4.1): the comic
      it opened on, and the comic whose cover is open full size. Pure Dart, so
      the blocs that update it stay Flutter-free (R15).
    flow_state.id: |-
      The comic the flow opened on (`/comics/:id`); the flow starts from
      the id alone (plan 01 §4.4).
    flow_state.cover: |-
      The loaded comic whose cover page is open: the cover page needs no
      second request, and the repository stays stateless.
    repository.fetch_item: |-
      The comic with its cast, in one request: the detail carries the cast
      summary (T-0041), so there is no request per character. An unknown
      comic is [ApiNotFound].
    details_state.success: The comic, its credits and its cast.
    details_bloc.open_guard: |-
      How long after handing a character or creator over a second hand-over of
      the same one is ignored: the second tap of a double tap (P-089). By then the opened page
      covers this one. The same value as `discovery_search`'s open guard.
    details_bloc.doc: |-
      The details page's bloc: loads the comic the flow opened on (and its
      cast), opens its cover inside the flow, and hands a tapped character or
      creator over to the app through the navigator, which only blocs call
      (plan 01 §4.1). A second hand-over of the same target within [openGuard] is ignored, so a
      double tap opens one page.

      Pure Dart (R15): it imports `package:bloc` through `mc_bloc_kit`, never
      Flutter, so every generator that reads it runs on analyzer summaries.
    details_bloc.start_guard: |-
      False while a hand-over of the same [target] still guards (the second
      tap of a double tap); else starts the guard for it. A different target
      goes through at once: popping back and tapping something else within
      [openGuard] is not a double tap.
