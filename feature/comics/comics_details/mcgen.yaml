# The section-detail (SC) exemplar's spec (T-0072, P2-05). `mcgen gen
# comics_details --check` renders it and compares the render with this
# package, byte for byte outside keep regions and owned files (plan 02 KD1,
# ADR-0017). The package stays hand-built (ejected); gen writes only
# .mcgen/manifest.json.
#
# What the archetype does not template is owned: the model files (entity,
# DTOs, mapper), the pages and widgets, the cover page, the test env, the
# flow-scope test, the contract tests and the steps about this page's own
# sections. The `entities` below are the starting point mcgen would write for
# them (only what the managed files reference); the hand-written files are
# richer, and only their existence is checked.
schema: mcgen/1
module: comics_details
tier: feature
archetype: section_detail
ownership: ejected
exemplar: true
description: One comic's page in sections, with a favourite that asks the app to sign in.
deps: [mc_ds_buttons, mc_ds_cards, mc_ds_feedback, mc_ds_layout, mc_ds_media, mc_ds_navigation, mc_ds_theme, mc_ds_tokens, mc_formatters, mc_l10n_core, mc_media]
dev_deps: [mc_fixtures_characters, mc_fixtures_comics, mc_mocked_backend, mc_storage]
owned:
  - lib/src/domain/model/comic.dart
  - lib/src/domain/model/comic_dto.dart
  - lib/src/domain/model/comic_mapper.dart
  - lib/src/presentation/page/**
  - lib/src/presentation/widget/comic_*.dart
  - test/contract/**
  - test/feature/util/comics_details_env.dart
  - test/flow_scope_test.dart
  - test/golden/**
keep: [details.openCharacter, details.openCreator]

entities:
  - name: Comic
    doc: |-
      A comic as this page shows it.
    fields:
      - {name: id, type: ComicId}
      - {name: title, type: String}
  - name: ComicDto
    json: true
    doc: |-
      `GET /v1/comics/:id`: one comic in detail.
    fields:
      - {name: id, type: int}
      - {name: title, type: String}

navigator:
  name: ComicsDetailsNavigator
  doc: |-
    What comics_details needs from outside: intents in the feature's own
    language, never routes (plan 01 §4.1). Implemented in
    `app/wiring/publishing_wiring` (T-0041). Only blocs call it.
  outbound: [openCharacter(CharacterId), openCreator(CreatorId), "requestSignIn() -> bool"]

