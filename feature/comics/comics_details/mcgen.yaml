bdd:
  - feature: comics_details
    title: "A comic's page"
    description: |-
      Fans open one comic and read it section by section: the cover, the
      synopsis, the facts, the creators and the cast, each leading on.
    background:
      - "# Only the comics domain: the cast comes in the detail (T-0041), and the"
      - "# strict harness fails any request to a route nothing serves."
      - "Given the backend serves {'comics.default'}"
    scenarios:
      - title: "The comic shows its cover, title, issue and synopsis"
        tags: [T-0041-AC1, smoke]
        steps:
          - "When I open comic {501500}"
          - "Then the backend received {'GET /v1/comics/501500'}"
          - "And I see the header of comic {501500} with its bundled cover"
          - "And I see {'Issue #1'}"
          - "And I see {'Synopsis'}"
          - "And I see the synopsis of comic {501500}"
      - title: "The facts are formatted for English"
        tags: [T-0041-AC1]
        steps:
          - "When I open comic {501500}"
          - "Then I see {'Details'}"
          - "And the fact {'Issue'} reads {'#1'}"
          - "And the fact {'Price'} reads {'\\$3.99'}"
          - "And the fact {'Pages'} reads {'32'}"
          - "And the fact {'Released'} reads {'Jan 10, 1988'}"
      - title: "The creators and characters sections list the comic's credits"
        tags: [T-0041-AC1]
        steps:
          - "When I open comic {501500}"
          - "Then the creators section lists the credits of comic {501500}"
          - "And I see {'Esme Garrow'}"
          - "And I see {'Cover artist'}"
          - "And the characters section lists the cast of comic {501500}"
          - "And I see {'Amber Vanguard'}"
          - "And I see {'Prism Engineer'}"
          - "And the backend received {1} requests for {'GET /v1/comics/501500'}"
          - "And the backend received {0} requests for {'GET /v1/characters/:id'}"
      - title: "A failed comic explains the problem and retries"
        tags: [T-0041-AC2]
        steps:
          - "Given the backend fails {'GET /v1/comics/501500'} with {<failure>}"
          - "When I open comic {501500}"
          - "Then I see {'The comic could not be loaded'}"
          - "And I see {<message>}"
          - "When the backend recovers"
          - "And I tap {'Retry'}"
          - "Then I see the header of comic {501500} with its bundled cover"
          - "And I don't see {'The comic could not be loaded'}"
        examples:
          - ["failure", "message"]
          - ["'server_error'", "'The server had a problem. Please try again later.'"]
          - ["'timeout'", "'The request took too long. Please try again.'"]
          - ["'offline'", "'No connection. Check your network and try again.'"]
          - ["'malformed'", "'Something went wrong.'"]
      - title: "A double Retry sends one request"
        tags: [T-0041-AC2]
        steps:
          - "Given the backend fails {'GET /v1/comics/501500'} with {'malformed'}"
          - "When I open comic {501500}"
          - "Then I see {'The comic could not be loaded'}"
          - "When the backend recovers"
          - "And I tap {'Retry'} twice in quick succession"
          - "Then I see the header of comic {501500} with its bundled cover"
          - "And the backend received {2} requests for {'GET /v1/comics/501500'}"
      - title: "An unknown comic shows that it was not found"
        tags: [T-0041-AC2]
        steps:
          - "When I open comic {999999}"
          - "Then I see {'Comic not found'}"
          - "And I see {'This comic does not exist or is no longer available.'}"
          - "And I don't see {'Retry'}"
          - "And nothing overflows"
          - "And the backend received {1} requests for {'GET /v1/comics/999999'}"
      - title: "Tapping a character hands it over to the app exactly once"
        tags: [T-0041-AC3]
        steps:
          - "When I open comic {501500}"
          - "And I tap the cast member {'Amber Vanguard'}"
          - "Then the app was asked to open character {'Amber Vanguard'}"
      - title: "Tapping a creator hands them over to the app exactly once"
        tags: [T-0041-AC3]
        steps:
          - "When I open comic {501500}"
          - "And I tap the creator {'Esme Garrow'}"
          - "Then the app was asked to open creator {'Esme Garrow'} of comic {501500}"
      - title: "A double tap on a character hands it over once (P-089)"
        tags: [T-0050-AC3]
        steps:
          - "When I open comic {501500}"
          - "And I tap the cast member {'Amber Vanguard'} twice in quick succession"
          - "Then the app was asked to open character {'Amber Vanguard'}"
      - title: "A second tap 499 ms after the first is still the same tap (P-089)"
        tags: [T-0050-AC3]
        steps:
          - "When I open comic {501500}"
          - "And I tap the cast member {'Amber Vanguard'} and again after {499} milliseconds"
          - "Then the app was asked to open character {'Amber Vanguard'}"
      - title: "A tap 501 ms after the first opens the character again (P-089)"
        tags: [T-0050-AC3]
        steps:
          - "When I open comic {501500}"
          - "And I tap the cast member {'Amber Vanguard'} and again after {501} milliseconds"
          - "Then the app was asked to open character {'Amber Vanguard'} {2} times"
      - title: "Tapping a different character 450 ms later is not a double tap (P-089)"
        tags: [T-0050-AC3]
        steps:
          - "When I open comic {501500}"
          - "And I tap the cast member {'Amber Vanguard'} and then {'Prism Engineer'} after {450} milliseconds"
          - "Then the app was asked to open characters {'Amber Vanguard'} and {'Prism Engineer'}"
      - title: "A double tap on a creator hands them over once (P-089)"
        tags: [T-0050-AC3]
        steps:
          - "When I open comic {501500}"
          - "And I tap the creator {'Esme Garrow'} twice in quick succession"
          - "Then the app was asked to open creator {'Esme Garrow'} of comic {501500}"
      - title: "Tapping the cover opens it full size inside the flow"
        steps:
          - "When I open comic {501500}"
          - "And I tap the cover"
          - "Then I see the cover page of comic {501500}"
          - "When I swipe back"
          - "Then I don't see the cover page"
          - "And I see the header of comic {501500} with its bundled cover"
          - "And the backend received {1} requests for {'GET /v1/comics/501500'}"
      - title: "In German the sections and the formats are German"
        tags: [T-0041-AC4, l10n]
        steps:
          - "Given the device locale is {'de'}"
          - "When I open comic {501500}"
          - "Then I see {'Ausgabe #1'}"
          - "And I see {'Zu Favoriten hinzufügen'}"
          - "And I see {'Inhalt'}"
          - "And I see {'Angaben'}"
          - "And the fact {'Ausgabe'} reads {'#1'}"
          - "And the fact {'Preis'} reads {'3,99 \\$'}"
          - "And the fact {'Seiten'} reads {'32'}"
          - "And the fact {'Erschienen'} reads {'10. Jan. 1988'}"
          - "When I scroll the comic until I see {'Mitwirkende'}"
          - "Then I see {'Autor'}"
          - "And I see {'Coverzeichner'}"
          - "When I scroll the comic until I see {'Figuren'}"
          - "Then I see {'Amber Vanguard'}"
      - title: "In German a failed comic explains itself in German"
        tags: [T-0041-AC4, l10n]
        steps:
          - "Given the device locale is {'de'}"
          - "And the backend fails {'GET /v1/comics/501500'} with {'server_error'}"
          - "When I open comic {501500}"
          - "Then I see {'Das Comic konnte nicht geladen werden'}"
          - "And I see {'Erneut versuchen'}"
      - title: "In German an unknown comic says so in German"
        tags: [T-0041-AC4, l10n]
        steps:
          - "Given the device locale is {'de'}"
          - "When I open comic {999999}"
          - "Then I see {'Comic nicht gefunden'}"
          - "And I see {'Dieses Comic gibt es nicht oder nicht mehr.'}"
      - title: "The pseudo-locale renders every section without overflow"
        tags: [T-0041-AC4, l10n]
        steps:
          - "Given the pseudo-locale is active"
          - "When I open comic {501500}"
          - "Then I see {'[Íššúé #1 ~~~~]'}"
          - "And I see {'[Àðð ţó ƒàvóúŕíţéš ~~~~~~~]'}"
          - "And nothing overflows"
          - "When I scroll the comic to the end"
          - "Then I see {'[Çĥàŕàçţéŕš ~~~~]'}"
          - "And I see {'[Çóvéŕ àŕţíšţ ~~~~]'}"
          - "And nothing overflows"
          - "When I tap the cover"
          - "Then I see the cover page of comic {501500}"
          - "And nothing overflows"
      - title: "The pseudo-locale renders the not-found page without overflow"
        tags: [T-0041-AC4, l10n]
        steps:
          - "Given the pseudo-locale is active"
          - "When I open comic {999999}"
          - "Then I see {'[Çóɱíç ñóţ ƀóúñð ~~~~~~]'}"
          - "And nothing overflows"
  - feature: comics_details_favourite
    title: "Favourite a comic"
    description: |-
      Fans keep comics among their favourites. Signed out, the app asks them to
      sign in first; signed in, the toggle answers at once and owns up when the
      write fails.
    background:
      - "Given the backend serves {'comics.default'}"
      - "And the backend serves {'identity.default'}"
    scenarios:
      - title: "Signed out, the favourite waits for sign-in and then saves it"
        tags: [T-0041-AC6, smoke]
        steps:
          - "When I open comic {501500}"
          - "And I tap {'Add to favourites'}"
          - "Then the app was asked to sign in {1} time"
          - "And I see {'Add to favourites'}"
          - "And the button {'Add to favourites'} is disabled"
          - "And the backend received {0} requests for {'* /v1/me/favourites/:kind/:id'}"
          - "And the app announced {0} change to {'favourites'}"
          - "When signing in succeeds as {'reader@mini-client.test'}"
          - "Then I see {'Remove from favourites'}"
          - "And the backend received {1} requests for {'PUT /v1/me/favourites/comic/501500'}"
          - "And the backend received {'PUT /v1/me/favourites/comic/501500'} with the bearer of {'reader@mini-client.test'}"
          - "And the backend received {'GET /v1/me/favourites/comic/501500'} with the bearer of {'reader@mini-client.test'}"
          - "And the backend answered {'PUT /v1/me/favourites/comic/501500'} with {200}"
          - "And comic {501500} is a favourite of {'reader@mini-client.test'}"
          - "And the app announced {1} change to {'favourites'}"
      - title: "Signed out, backing out of sign-in changes nothing and sends nothing"
        tags: [T-0041-AC6]
        steps:
          - "When I open comic {501500}"
          - "And I tap {'Add to favourites'}"
          - "And signing in is cancelled"
          - "Then I see {'Add to favourites'}"
          - "And the app was asked to sign in {1} time"
          - "And the backend received {0} requests for {'* /v1/me/favourites/:kind/:id'}"
          - "And the backend received {0} requests for {'* /v1/me'}"
          - "And the app announced {0} change to {'favourites'}"
          - "And comic {501500} is not a favourite of {'reader@mini-client.test'}"
      - title: "Signed out, a double tap asks to sign in once and sends one request"
        tags: [T-0041-AC6]
        steps:
          - "When I open comic {501500}"
          - "And I tap {'Add to favourites'} twice in quick succession"
          - "Then the app was asked to sign in {1} time"
          - "When signing in succeeds as {'reader@mini-client.test'}"
          - "Then I see {'Remove from favourites'}"
          - "And the backend received {1} requests for {'PUT /v1/me/favourites/comic/501500'}"
          - "And the app announced {1} change to {'favourites'}"
      - title: "Signed in, the toggle flips at once and a failed write rolls it back"
