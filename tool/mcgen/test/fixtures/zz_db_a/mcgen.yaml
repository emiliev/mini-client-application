bdd:
  - feature: zz_db_a_shelf
    title: "The shelf"
    description: |-
      A smaller dashboard: deals, featured comics and the cart, with no
      category page and no flag.
    background:
      - "Given the backend serves {'commerce.default'}"
      - "And the backend serves {'identity.default'}"
    scenarios:
