name: feature_form_wizard_build
description: A skeleton form/wizard feature's BUILD.bazel (T-0075). Written once, owned afterwards; P2-08's buildgen takes it over. mcgen computes every list from the generated code's use-graph.
version: 0.1.0

# mcgen precomputes every value (plan 02 section 2.4); by hand:
#   mason make feature_form_wizard_build -c vars.json
vars:
  build_file:
    type: string
    description: 'Always "BUILD.bazel". The template is named after this variable because a file named BUILD.bazel would make the brick directory a Bazel package (T-0069, F-0069).'
  build_preamble:
    type: string
    description: The comment block at the top of BUILD.bazel (each line ending in a newline).
  name:
    type: string
    description: The package name.
  lang:
    type: string
    description: The Dart language version (tool/mcgen/mcgen.yaml dart.language_version).
  pascal:
    type: string
    description: The flow's PascalCase stem (the gen-l10n class is <pascal>L10n).
  l10n_file:
    type: string
    description: The gen-l10n output file's stem.
  stem:
    type: string
    description: The file stem of the flow's files.
  pure_deps:
    type: array
    description: 'Labels of the generator-read files deps, items {"label": "..."}, sorted.'
  freezed:
    type: array
    description: 'Items {"name": "<target stem>", "src": "<file>"}, by name.'
  injectable:
    type: array
    description: 'Items {"src": "<file>"}: the files with injectable classes, sorted.'
  codegen:
    type: array
    description: 'Items {"target": ":<name>"}: every codegen target of the library.'
  flutter_deps:
    type: array
    description: 'Labels of the library deps beyond pure_deps, items {"label": "..."}, sorted.'
  test_deps:
    type: array
    description: 'Labels the BDD and flow-scope tests share, items {"label": "..."}, sorted.'
  env:
    type: string
    description: The BDD setup file (the test env).
