# T-0028: build_runner reference for the injectable shim (plan 03 §7.3, R28).
# Separate from ../pubspec.yaml because stock injectable_generator 3.1.3 needs
# lean_builder, whose `_fe_analyzer_shared <106` can't coexist with the
# analyzer 14.5.0 pin there (X3, F-0026). NOT a workspace member; Bazel never
# reads it. Generator-side packages that shape the output are pinned to the
# versions in rules_dart's dart/ext/pubspec.lock (fork patch 0002).
name: mc_build_runner_overlay_injectable
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  get_it: 8.3.0
  injectable: 3.0.0

dev_dependencies:
  build: 4.0.11
  build_runner: 2.16.1  # 2.16.2 does not resolve together with injectable_generator 3.1.3
  code_builder: 4.13.0
  dart_style: 3.1.14
  injectable_generator: 3.1.3
  recase: 4.1.0
  source_gen: 4.3.1
