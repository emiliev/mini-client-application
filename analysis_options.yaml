# Workspace analysis options. P1 replaces this with `include: package:mc_analysis/...`.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
linter:
  rules:
    - always_declare_return_types
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
formatter:
  trailing_commas: preserve
